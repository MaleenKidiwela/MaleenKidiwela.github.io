<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes — Maleen Kidiwela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>

:root {
  --bg:             #0c0c0f;
  --bg2:            #131318;
  --bg3:            #191920;
  --bg4:            #22222b;
  --border:         #26262f;
  --border-2:       #363642;

  --accent:         #4bb8c0;
  --accent-dim:     #1f4a4e;
  --accent-glow:    rgba(75, 184, 192, 0.08);

  --coszo:          #e6a24a;
  --coszo-dim:      #5c3d14;
  --coszo-glow:     rgba(230, 162, 74, 0.08);
  --bransfield:     #9884d8;
  --bransfield-dim: #3a2d6a;
  --bransfield-glow:rgba(152, 132, 216, 0.08);
  --earthnote:      #4cc592;
  --earthnote-dim:  #1c4d3a;
  --earthnote-glow: rgba(76, 197, 146, 0.08);

  --text:       #e8e8ea;
  --text-2:     #a0a0a8;
  --text-3:     #5c5c66;
  --text-muted: #7a7a84;

  --sidebar-w: 304px;
  --header-h:  58px;

  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', Menlo, monospace;
  --font-serif: 'Fraunces', Georgia, serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-diffuse: 0 20px 40px -18px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.03) inset;
  --shadow-float:   0 24px 60px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
  --shadow-drawer:  -24px 0 60px -20px rgba(0,0,0,0.6);

  --surface-glass:        rgba(19, 19, 24, 0.82);
  --surface-glass-strong: rgba(19, 19, 24, 0.92);
  --tt-bg:                var(--bg2);

  --md-h1:     #f0f0ef;
  --md-h2:     #dcdcdb;
  --md-strong: #f0ece0;
  --md-code:   #9cd0b8;
  --md-precode:#c0d8c4;

  --hud-backdrop-1: rgba(75,184,192,0.05);
  --hud-backdrop-2: rgba(152,132,216,0.025);
}

/* ── Light theme ── */
:root[data-theme="light"] {
  --bg:             #f6f6f4;
  --bg2:            #ffffff;
  --bg3:            #ededea;
  --bg4:            #e3e3df;
  --border:         #e3e3df;
  --border-2:       #cfcfc9;

  --accent:         #0c8790;
  --accent-dim:     #b8e0e3;
  --accent-glow:    rgba(12, 135, 144, 0.10);

  --coszo:          #c6761e;
  --coszo-dim:      #e6c69c;
  --coszo-glow:     rgba(198, 118, 30, 0.12);
  --bransfield:     #6a57c4;
  --bransfield-dim: #cfc5ea;
  --bransfield-glow:rgba(106, 87, 196, 0.12);
  --earthnote:      #1f8c63;
  --earthnote-dim:  #b9dec9;
  --earthnote-glow: rgba(31, 140, 99, 0.12);

  --text:       #1a1a1e;
  --text-2:     #545460;
  --text-3:     #8a8a94;
  --text-muted: #6e6e78;

  --shadow-diffuse: 0 20px 40px -18px rgba(30,30,40,0.14), 0 1px 0 rgba(255,255,255,0.6) inset;
  --shadow-float:   0 24px 60px -22px rgba(30,30,40,0.22), inset 0 1px 0 rgba(255,255,255,0.6);
  --shadow-drawer:  -24px 0 60px -20px rgba(30,30,40,0.18);

  --surface-glass:        rgba(255, 255, 255, 0.72);
  --surface-glass-strong: rgba(255, 255, 255, 0.88);
  --tt-bg:                #ffffff;

  --md-h1:     #111114;
  --md-h2:     #26262b;
  --md-strong: #0f0f12;
  --md-code:   #0a6958;
  --md-precode:#2a3a32;

  --hud-backdrop-1: rgba(12,135,144,0.06);
  --hud-backdrop-2: rgba(106,87,196,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.94rem;
  line-height: 1.6;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 85% 40% at 50% -8%, var(--hud-backdrop-1) 0%, transparent 60%),
    radial-gradient(ellipse 45% 65% at 100% 100%, var(--hud-backdrop-2) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
header {
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}

header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, var(--accent) 70%, transparent 100%);
  opacity: 0.15;
}

.wordmark {
  font-family: var(--font-sans);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
  text-decoration: none;
  white-space: nowrap;
}

.wordmark .accent-dot { color: var(--accent); }

.divider {
  width: 1px; height: 22px;
  background: var(--border);
  flex-shrink: 0;
}

.project-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
}

.tab-sep {
  width: 1px; height: 18px;
  background: var(--border);
  margin: 0 6px;
  flex-shrink: 0;
}

.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text-2);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  background: transparent;
  white-space: nowrap;
}

.tab:hover { color: var(--text); background: var(--bg3); border-color: var(--border-2); }

.tab[data-project="Dashboard"].active {
  color: var(--accent);
  background: var(--accent-glow);
  border-color: var(--accent-dim);
}

.tab[data-project="COSZO"].active {
  color: var(--coszo);
  background: var(--coszo-glow);
  border-color: var(--coszo-dim);
}

.tab[data-project="BransfieldEQ"].active {
  color: var(--bransfield);
  background: var(--bransfield-glow);
  border-color: var(--bransfield-dim);
}

.tab[data-project="Earthnote"].active {
  color: var(--earthnote);
  background: var(--earthnote-glow);
  border-color: var(--earthnote-dim);
}

.tab[data-project="Concepts"].active {
  color: var(--text);
  background: var(--bg3);
  border-color: var(--border-2);
}

.tab-concepts-icon { font-size: 14px; opacity: 0.85; }

.tab-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-coszo      { background: var(--coszo);      box-shadow: 0 0 0 2px var(--coszo-glow); }
.dot-bransfield { background: var(--bransfield); box-shadow: 0 0 0 2px var(--bransfield-glow); }
.dot-earthnote  { background: var(--earthnote);  box-shadow: 0 0 0 2px var(--earthnote-glow); }

.tab-dash-icon { font-size: 15px; opacity: 0.8; }

.back-link {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  text-decoration: none;
  letter-spacing: 0.02em;
  transition: color 0.15s;
  white-space: nowrap;
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-2);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  padding: 0;
}
.theme-toggle:hover { color: var(--text); border-color: var(--border-2); background: var(--bg3); }
.theme-toggle:active { transform: translateY(1px); }
.theme-toggle svg { width: 15px; height: 15px; display: block; }
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }
:root[data-theme="light"] .theme-toggle .icon-sun  { display: block; }
:root[data-theme="light"] .theme-toggle .icon-moon { display: none; }
.back-link:hover { color: var(--text-2); }

/* ── Layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* On desktop, hide the aside entirely in dashboard / concepts modes so
   main fills the canvas. On mobile we want the aside to remain available
   as the slide-in nav sheet, so this is gated to >=769px. */
@media (min-width: 769px) {
  .layout.dashboard-mode aside { display: none; }
  .layout.concepts-mode  aside { display: none; }
  body:has(.layout.concepts-mode) .sidebar-toggle { display: none !important; }
  body:has(.layout.concepts-mode) .sidebar-overlay { display: none !important; }
}
.layout.concepts-mode  main  { padding: 0; }
main.concepts-active .content-header { display: none; }
main.concepts-active .content-scroll { padding: 0; height: 100%; }
main.concepts-active #content-area  { padding: 0; height: 100%; }

/* Mobile section menu inside the aside — hidden on desktop. */
.mobile-tabs { display: none; }
.mobile-tabs-eyebrow {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--text-3); letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 16px 16px 8px;
}
.mobile-tab {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; margin: 0;
  background: transparent; border: 0;
  color: var(--text); cursor: pointer;
  font-family: var(--font-sans); font-size: 15px; font-weight: 500;
  text-align: left; width: 100%;
  border-left: 2px solid transparent;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}
.mobile-tab:hover { background: var(--bg3); color: var(--text); }
.mobile-tab.active {
  background: var(--bg3); color: var(--text);
  border-left-color: var(--accent);
}

/* ── Sidebar ── */
aside {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 500;
}

.file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0;
}

.file-tree::-webkit-scrollbar { width: 3px; }
.file-tree::-webkit-scrollbar-track { background: transparent; }
.file-tree::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

.folder { margin-bottom: 4px; }

.folder-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text);
  transition: color 0.12s;
  user-select: none;
}

.folder-label:hover { color: var(--accent); }

.folder-label .chevron {
  font-size: 9px;
  transition: transform 0.2s ease;
  color: var(--text-3);
  width: 10px;
  flex-shrink: 0;
  text-align: center;
  display: inline-block;
}

.folder.open .chevron { transform: rotate(90deg); }

.folder-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.file-list { display: none; padding-left: 16px; padding-bottom: 6px; }
.folder.open .file-list { display: block; }

.file-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 16px 6px 10px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
  border-left: 2px solid transparent;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.5;
  opacity: 0;
  animation: fileItemIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: calc(var(--i, 0) * 22ms);
}

@keyframes fileItemIn {
  from { opacity: 0; transform: translateX(-4px); }
  to   { opacity: 1; transform: translateX(0); }
}

.file-item:hover { color: var(--text); border-left-color: var(--border-2); background: rgba(220,235,255,0.03); transform: translateX(2px); }
.file-item.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-glow); }
.file-icon { color: var(--text-3); font-size: 10px; flex-shrink: 0; margin-top: 3px; }
.file-item.active .file-icon { color: var(--accent); }

/* ── Main ── */
main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

main.dashboard-active .content-header { display: none; }
main.dashboard-active .content-scroll {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
main.dashboard-active #content-area {
  flex: 1;
  display: flex;
  min-height: 0;
}
main.dashboard-active #content-area > .dashboard-layout {
  flex: 1;
  min-height: 0;
}

.content-header {
  padding: 11px 40px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  flex-shrink: 0;
  min-height: 44px;
}

.breadcrumb {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-3);
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  flex-wrap: wrap;
}

.breadcrumb span { color: var(--text-2); }

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 48px 80px 100px;
}
.content-scroll.iframe-mode {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.content-scroll.iframe-mode #content-area {
  flex: 1;
  height: 100%;
}

.content-scroll::-webkit-scrollbar { width: 4px; }
.content-scroll::-webkit-scrollbar-track { background: transparent; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  color: var(--text-3);
  text-align: center;
}

.empty-glyph { font-size: 40px; opacity: 0.22; margin-bottom: 8px; }
.empty-state p { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; }

/* ── Project landing ── */
.project-landing {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: 32px;
  padding: 48px 56px 64px;
  align-content: start;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.project-hero {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px 32px 28px;
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-diffuse);
}

.project-hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
}

.project-hero.coszo::before      { background: linear-gradient(90deg, transparent, var(--coszo) 40%, var(--coszo) 60%, transparent); opacity: 0.7; }
.project-hero.bransfield::before { background: linear-gradient(90deg, transparent, var(--bransfield) 40%, var(--bransfield) 60%, transparent); opacity: 0.7; }
.project-hero.earthnote::before  { background: linear-gradient(90deg, transparent, var(--earthnote) 40%, var(--earthnote) 60%, transparent); opacity: 0.7; }

.card-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }
.card-label.coszo      { color: var(--coszo); }
.card-label.bransfield { color: var(--bransfield); }
.card-label.earthnote  { color: var(--earthnote); }

.card-title { font-family: var(--font-serif); font-size: 30px; font-weight: 400; color: var(--text); margin-bottom: 14px; line-height: 1.15; letter-spacing: -0.02em; }
.card-desc { font-family: var(--font-sans); font-size: 14px; color: var(--text-2); line-height: 1.6; white-space: pre-line; }
.card-count { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 8px; letter-spacing: 0.02em; }

/* File list on the right */
.landing-files {
  display: flex;
  flex-direction: column;
}

.landing-files-head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 4px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  font-weight: 500;
}

.landing-file {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  opacity: 0;
  animation: fileItemIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: calc(var(--i, 0) * 28ms);
}

.landing-file:hover { padding-left: 12px; border-bottom-color: var(--border-2); }
.landing-file:hover .landing-file-arrow { opacity: 1; transform: translateX(0); }

.landing-file-icon {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  flex-shrink: 0;
  width: 16px;
}

.landing-file-name {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.landing-file-arrow {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-3);
  opacity: 0;
  transform: translateX(-4px);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.landing-file.coszo:hover .landing-file-arrow      { color: var(--coszo); }
.landing-file.bransfield:hover .landing-file-arrow { color: var(--bransfield); }
.landing-file.earthnote:hover .landing-file-arrow  { color: var(--earthnote); }

/* ── Dashboard layout ── */
.dashboard-layout {
  position: relative;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 60% 50% at 30% 35%, rgba(75,184,192,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 70% 65%, rgba(152,132,216,0.03) 0%, transparent 60%);
}

/* ── Constellation stage (fills dashboard) ── */
.constellation-stage {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.constellation-stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.constellation-stage canvas:active { cursor: grabbing; }

.constellation-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--tt-bg);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  white-space: nowrap;
  opacity: 0;
  transform: translate(-50%, -130%);
  transition: opacity 0.15s ease;
  z-index: 5;
  box-shadow: var(--shadow-diffuse);
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.constellation-tooltip.visible { opacity: 1; }

.constellation-tooltip .tt-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 3px;
  font-weight: 500;
}

/* HUD overlay — sits on top of canvas */
.dashboard-hud {
  position: absolute;
  top: 28px;
  left: 32px;
  z-index: 3;
  pointer-events: none;
  max-width: 420px;
}

.hud-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 500;
  margin-bottom: 10px;
}

.hud-title {
  font-family: var(--font-serif);
  font-size: clamp(26px, 3.2vw, 38px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 12px;
  max-width: 14ch;
}

.hud-sub {
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  max-width: 360px;
}

.hud-hint {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hud-hint .kbd {
  padding: 2px 6px;
  border: 1px solid var(--border-2);
  border-radius: 3px;
  background: rgba(255,255,255,0.03);
  font-size: 9.5px;
  color: var(--text-2);
}

.hud-stats {
  display: flex;
  gap: 28px;
  margin-top: 22px;
  font-family: var(--font-mono);
}

.hud-stat { display: flex; flex-direction: column; gap: 4px; }
.hud-stat-n  { font-size: 22px; color: var(--text); letter-spacing: -0.01em; }
.hud-stat-l  { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }

/* Floating calendar — bottom-right card */
.cal-floating {
  position: absolute;
  right: 28px;
  bottom: 28px;
  z-index: 4;
  width: 300px;
  background: var(--surface-glass);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-float);
  transition: opacity 0.3s, transform 0.3s;
}

/* When drawer opens, tuck calendar behind it */
.notes-drawer.open ~ .cal-floating,
.dashboard-layout.drawer-open .cal-floating {
  opacity: 0;
  transform: translateX(20px);
  pointer-events: none;
}

/* Notes drawer — slides in from right when a date is selected */
.notes-drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 420px;
  z-index: 4;
  background: var(--surface-glass-strong);
  backdrop-filter: blur(20px) saturate(130%);
  -webkit-backdrop-filter: blur(20px) saturate(130%);
  border-left: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow-drawer);
}

.notes-drawer.open { transform: translateX(0); }

.notes-drawer-head {
  padding: 28px 28px 18px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.notes-drawer-close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-3);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1;
  transition: all 0.15s;
}
.notes-drawer-close:hover { color: var(--text); border-color: var(--border-2); }

.notes-drawer-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
  font-weight: 500;
}

.notes-drawer-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.notes-drawer-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  margin-top: 8px;
  letter-spacing: 0.02em;
}

.notes-drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 22px 28px 32px;
}

.notes-drawer-body::-webkit-scrollbar { width: 4px; }
.notes-drawer-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.cal-panel-legacy-hide { display: none; }

.cal-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cal-panel::-webkit-scrollbar { width: 3px; }
.cal-panel::-webkit-scrollbar-track { background: transparent; }
.cal-panel::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.cal-month-label {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.02em;
  text-align: center;
  flex: 1;
}

.cal-nav-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text-2);
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 16px;
  font-family: var(--font-mono);
  line-height: 1;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cal-nav-btn:active { transform: translateY(1px); }

.cal-nav-btn:hover { color: var(--text); border-color: var(--border-2); background: var(--bg4); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-dow {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-3);
  padding: 6px 2px 8px;
  text-transform: uppercase;
  font-weight: 500;
}

.cal-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: default;
  transition: all 0.14s;
  position: relative;
  padding: 5px 2px 4px;
  gap: 3px;
  min-height: 38px;
}

.cal-day.clickable { cursor: pointer; }
.cal-day.clickable:hover { background: var(--bg3); }

.cal-day-num {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1;
}

.cal-day.other-month .cal-day-num { color: var(--text-3); opacity: 0.5; }
.cal-day.today { background: var(--accent-glow); }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 500; }

.cal-day.selected {
  background: var(--bg4) !important;
  border: 1px solid var(--border-2);
  box-shadow: 0 0 0 1px var(--border-2) inset;
}

.cal-day.selected .cal-day-num { color: var(--text) !important; }

.cal-dots {
  display: flex;
  gap: 2px;
  justify-content: center;
  min-height: 5px;
}

.cal-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cal-legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}

.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.02em;
}

/* ── Notes panel (right side of dashboard) ── */
.notes-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.notes-panel-header {
  padding: 24px 32px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.notes-panel-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.notes-panel-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  margin-top: 8px;
  letter-spacing: 0.02em;
}

.notes-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 32px 40px;
}

.notes-panel-body::-webkit-scrollbar { width: 4px; }
.notes-panel-body::-webkit-scrollbar-track { background: transparent; }
.notes-panel-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

.note-entry {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  background: var(--bg2);
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.note-entry:hover { border-color: var(--border-2); transform: translateX(2px); background: var(--bg3); box-shadow: var(--shadow-diffuse); }
.note-entry:active { transform: translateX(2px) scale(0.99); }
.note-entry.highlighted { border-color: var(--border-2); background: var(--bg3); }

.note-date-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  min-width: 50px;
  flex-shrink: 0;
}

.note-proj-badge {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  white-space: nowrap;
  font-weight: 500;
}

.note-filename {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-open-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
  flex-shrink: 0;
  transition: color 0.12s;
}

.note-entry:hover .note-open-hint { color: var(--accent); }

.timeline-section-header {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 18px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
  font-weight: 500;
}

.timeline-section-header:first-child { padding-top: 0; }

.no-notes-hint {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-3);
  padding: 24px 0;
  letter-spacing: 0.02em;
}

/* ── Markdown ── */
.md-body { max-width: 720px; font-size: 15.5px; line-height: 1.78; font-family: var(--font-serif); }

.md-body h1 {
  font-family: var(--font-serif);
  font-size: 36px; font-weight: 400;
  color: var(--md-h1); margin-bottom: 28px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  line-height: 1.15; letter-spacing: -0.025em;
}

.md-body h2 {
  font-family: var(--font-serif);
  font-size: 24px; font-weight: 400;
  color: var(--md-h2); margin: 44px 0 14px;
  line-height: 1.25; letter-spacing: -0.018em;
}

.md-body h3 {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); margin: 34px 0 12px; font-weight: 500;
}

.md-body h4 { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); margin: 24px 0 10px; letter-spacing: 0.04em; font-weight: 500; }
.md-body p  { color: var(--text); margin-bottom: 16px; line-height: 1.78; font-size: 15.5px; }
.md-body ul, .md-body ol { margin: 0 0 16px 22px; color: var(--text); line-height: 1.78; }
.md-body li { margin-bottom: 5px; font-size: 15.5px; }
.md-body li input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); }

.md-body .wikilink {
  color: var(--accent); border-bottom: 1px dashed var(--accent-dim);
  padding-bottom: 1px; cursor: pointer; text-decoration: none;
}
.md-body a.wikilink:hover { border-bottom-style: solid; text-decoration: none; }
.md-body a.wikilink.broken {
  color: var(--text-muted); border-bottom-color: var(--text-muted);
  cursor: not-allowed;
}
.md-body mark {
  background: rgba(245, 168, 51, 0.18); color: var(--text);
  padding: 0 3px; border-radius: 2px;
}
.md-body .katex { font-size: 1.05em; }
.md-body .katex-display { margin: 18px 0; overflow-x: auto; overflow-y: hidden; }

.md-body code {
  font-family: var(--font-mono); font-size: 13px;
  background: var(--bg3); border: 1px solid var(--border);
  padding: 2px 6px; border-radius: 4px; color: var(--md-code);
}

.md-body pre {
  background: var(--bg3); border: 1px solid var(--border);
  border-left: 2px solid var(--accent-dim); padding: 20px 24px;
  border-radius: var(--radius-md); overflow-x: auto; margin-bottom: 22px;
}

.md-body pre code { background: none; border: none; padding: 0; font-size: 13px; color: var(--md-precode); line-height: 1.7; }

.md-body blockquote {
  border-left: 2px solid var(--accent-dim); padding: 12px 22px; margin: 0 0 16px;
  color: var(--text-2); font-style: italic;
  background: var(--accent-glow); border-radius: 0 var(--radius-md) var(--radius-md) 0;
}

.md-body table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-family: var(--font-mono); font-size: 13px; }
.md-body th { background: var(--bg3); border: 1px solid var(--border); padding: 10px 14px; text-align: left; color: var(--accent); font-weight: 500; letter-spacing: 0.06em; font-size: 10.5px; text-transform: uppercase; }
.md-body td { border: 1px solid var(--border); padding: 9px 14px; color: var(--text); line-height: 1.6; }
.md-body tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }
.md-body a { color: var(--accent); text-decoration: none; }
.md-body a:hover { text-decoration: underline; }
.md-body strong { color: var(--md-strong); font-weight: 600; }
.md-body em { color: var(--text-2); }

/* ── Loading (skeleton shimmer) ── */
.loading { display: flex; flex-direction: column; gap: 14px; max-width: 720px; padding: 8px 0; }
.skel {
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--bg2) 0%, var(--bg3) 50%, var(--bg2) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}
.skel.h1 { height: 32px; width: 55%; margin-bottom: 14px; }
.skel.p  { width: 100%; }
.skel.p.short { width: 72%; }
.skel.p.mid   { width: 88%; }

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Status bar ── */
.statusbar {
  height: 26px; background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 20px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3);
  flex-shrink: 0; z-index: 10; letter-spacing: 0.01em;
}

.status-item { display: flex; align-items: center; gap: 7px; }
.status-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--earthnote);
  box-shadow: 0 0 0 2px var(--earthnote-glow);
  animation: breathe 2.8s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.7; }
  50%      { opacity: 1; }
}

/* ── Entrance ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

header    { animation: fadeUp 0.38s ease both; }
aside     { animation: fadeUp 0.38s ease 0.07s both; }
main      { animation: fadeUp 0.38s ease 0.13s both; }
.statusbar{ animation: fadeUp 0.38s ease 0.17s both; }

/* ── Hamburger (desktop: hidden) ── */
.sidebar-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-2);
  cursor: pointer;
  width: 34px; height: 34px;
  font-size: 17px;
  flex-shrink: 0;
  transition: all 0.14s;
}
.sidebar-toggle:hover { border-color: var(--border-2); color: var(--text); }

/* ── Sidebar overlay (desktop: hidden) ── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 99;
  backdrop-filter: blur(2px);
}
.sidebar-overlay.visible { display: block; }

/* ─────────────────────────────────────────────
   MOBILE  ≤ 768px
───────────────────────────────────────────── */
@media (max-width: 768px) {

  /* Header */
  header {
    padding: 0 12px;
    gap: 10px;
    height: 52px;
  }

  header::after { opacity: 0.15; }

  .wordmark { font-size: 13px; }

  .divider { display: none; }

  .project-tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 4px;
    flex: 1;
  }
  .project-tabs::-webkit-scrollbar { display: none; }

  .tab {
    font-size: 12px;
    padding: 5px 11px;
    gap: 6px;
    flex-shrink: 0;
  }

  .tab-dot { width: 6px; height: 6px; }

  .back-link { display: none; }

  .sidebar-toggle { display: flex; }

  /* .layout creates a z-index:1 stacking context which would trap the
     fixed-position aside (z:100) below the sibling overlay (z:99). Drop
     the layout's stacking context on mobile so aside escapes to body. */
  .layout { z-index: auto; }

  /* Sidebar — slides in as overlay on mobile */
  aside {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 110;
    width: 280px;
    background: var(--bg2);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    animation: none;
    border-right: 1px solid var(--border-2);
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }

  aside.open { transform: translateX(0); }

  /* Main layout — no overflow hidden, let it be a normal flow */
  .layout { overflow: visible; height: auto; }

  main { overflow: visible; }

  main.dashboard-active .content-scroll {
    overflow-y: auto;
    padding: 0;
    height: auto;
  }

  .content-header { padding: 10px 16px; }

  .content-scroll {
    padding: 20px 16px 80px;
    overflow-x: hidden;
    overflow-y: auto;
    height: auto;
    flex: none;
    min-height: 0;
    max-width: 100vw;
  }

  .content-scroll.iframe-mode {
    height: calc(100dvh - 52px - 44px);
    overflow: hidden;
  }

  #content-area {
    overflow-x: hidden;
    max-width: 100%;
  }

  /* Dashboard stacks vertically on mobile */
  main.dashboard-active .content-scroll { overflow-y: auto; }
  main.dashboard-active #content-area { display: block; flex: none; }
  .dashboard-layout {
    display: block;
    position: relative;
    height: auto;
    min-height: 0;
    overflow: visible;
  }
  .constellation-stage {
    position: relative;
    inset: auto;
    height: 52vh;
    min-height: 340px;
    max-height: 480px;
    border-bottom: 1px solid var(--border);
  }
  .dashboard-hud {
    position: static;
    padding: 22px 18px 4px;
    max-width: none;
  }
  .hud-title { font-size: 24px; margin-bottom: 10px; max-width: none; }
  .hud-sub { font-size: 12.5px; }
  .hud-stats { gap: 22px; margin-top: 16px; }
  .hud-stat-n { font-size: 18px; }
  .hud-hint { margin-top: 12px; }

  .cal-floating {
    position: static;
    width: auto;
    margin: 14px 18px 28px;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: var(--bg2);
    opacity: 1 !important;
    transform: none !important;
    pointer-events: auto !important;
  }
  .notes-drawer {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 72dvh;
    border-left: none;
    border-top: 1px solid var(--border-2);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transform: translateY(100%);
  }
  .notes-drawer.open { transform: translateY(0); }

  .cal-panel {
    width: 100%;
    padding: 0;
    gap: 18px;
  }

  .cal-nav-btn { width: 36px; height: 36px; font-size: 20px; }
  .cal-month-label { font-size: 18px; }

  .cal-day { min-height: 42px; }
  .cal-day-num { font-size: 12px; }

  .notes-panel { flex: none; overflow: visible; }

  .notes-panel-header { padding: 18px 16px 12px; }
  .notes-panel-title { font-size: 20px; }

  .notes-panel-body {
    flex: none;
    overflow-y: visible;
    padding: 14px 16px 40px;
  }

  .notes-drawer-head { padding: 18px 20px 14px; }
  .notes-drawer-title { font-size: 22px; }
  .notes-drawer-body { padding: 18px 20px 32px; }

  .note-entry { gap: 8px; padding: 10px 12px; }
  .note-filename { font-size: 12px; }
  .note-open-hint { display: none; } /* too cramped on mobile */

  /* Project landing — single column */
  .project-landing {
    grid-template-columns: 1fr;
    padding: 20px 16px 40px;
    gap: 24px;
  }
  .project-hero { padding: 24px 22px 22px; }
  .card-title { font-size: 26px; }
  .card-desc { font-size: 13.5px; }

  /* Markdown */
  .md-body { font-size: 15px; }
  .md-body h1 { font-size: 26px; }
  .md-body h2 { font-size: 21px; }
  .md-body h3 { font-size: 11px; }
  .md-body table { font-size: 12px; }
  .md-body th, .md-body td { padding: 7px 10px; }
  .md-body pre { padding: 14px 16px; }
  .md-body pre code { font-size: 12px; }

  /* Status bar */
  .statusbar { padding: 0 14px; font-size: 10px; height: 24px; }

  /* Body — allow vertical scroll, prevent horizontal blowout */
  body {
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100vh;
  }

  /* Header sticks to top so tabs are always reachable */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    animation: none;
  }

  /* Markdown content — constrain to viewport width */
  .md-body {
    max-width: 100%;
    overflow-x: hidden;
    word-break: break-word;
  }

  /* Tables scroll independently — let cells wrap naturally */
  .md-body table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }

  .md-body th,
  .md-body td {
    white-space: normal;
    word-break: break-word;
  }

  /* Code blocks already have overflow-x:auto — just clamp width */
  .md-body pre {
    max-width: 100%;
  }

  /* Inline code — allow wrapping */
  .md-body code {
    word-break: break-all;
    white-space: pre-wrap;
  }

  .md-body pre code {
    word-break: normal;
    white-space: pre;
  }

  /* Mobile: hide horizontal project-tabs strip, show vertical menu in aside.
     The sandwich button is the way to switch tabs on small viewports. */
  header .project-tabs { display: none; }
  .sidebar-toggle { display: flex !important; }
  .mobile-tabs { display: flex; flex-direction: column; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }

  /* Concepts view: tighter padding on mobile */
  .concepts-view { padding: 14px 14px 18px; }

  /* Graph HUD: compact + collapsible (starts collapsed on mobile via JS) */
  .cg-hud { top: 10px; left: 10px; padding: 10px 12px; max-width: 200px; }
  .cg-hud.is-collapsed { padding: 7px 12px; }
  .cg-hud-title { font-size: 13px; margin-bottom: 8px; }
  .cg-hud-eyebrow { font-size: 9px; }
  .cg-hud-row { font-size: 10px; gap: 7px; }
  .cg-hud-stats { row-gap: 3px; column-gap: 10px; padding-bottom: 9px; margin-bottom: 9px; }
  .cg-hud-section + .cg-hud-section { margin-top: 8px; padding-top: 8px; }

  /* Side panel becomes a bottom sheet on mobile */
  .cg-side {
    top: auto; right: 10px; bottom: 10px; left: 10px;
    width: auto; max-width: none;
    max-height: 60vh;
    padding: 22px 18px 18px;
  }
  .cg-side-title { font-size: 21px; }

  /* Status hint shrinks */
  .cg-status { bottom: 10px; right: 12px; font-size: 9px; max-width: 50%; }
}

/* ── Concepts view ────────────────────────────────────────────────────── */
.concepts-view {
  padding: 24px 28px 32px;
  margin: 0 auto;
  font-family: var(--font-sans);
  height: 100%;
  display: flex;
  flex-direction: column;
}
.concepts-view #concepts-render {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.concepts-view .concepts-graph-wrap {
  height: 100%;
  min-height: 480px;
}
.concepts-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
}
.concepts-title {
  font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.01em;
}
.concepts-meta {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
}
.concepts-controls {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px;
  align-items: center;
}
.concepts-search {
  flex: 1; min-width: 220px;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: 6px;
  font-family: var(--font-mono); font-size: 13px;
}
.concepts-search:focus { outline: none; border-color: var(--border-2); }
.concept-filter {
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 12px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 11px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.concept-filter.active {
  color: var(--text); background: var(--bg3); border-color: var(--border-2);
}
.concept-list { display: flex; flex-direction: column; gap: 6px; }
.concept-row {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden; transition: border-color 0.15s;
}
.concept-row:hover { border-color: var(--border-2); }
.concept-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; cursor: pointer;
}
.concept-kind {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  min-width: 80px;
}
.concept-label {
  flex: 1; color: var(--text); font-size: 14px; font-weight: 500;
}
.concept-projects { display: flex; gap: 4px; }
.concept-proj-dot { width: 6px; height: 6px; border-radius: 50%; }
.concept-count {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  min-width: 24px; text-align: right;
}
.concept-chevron { color: var(--muted); font-size: 11px; transition: transform 0.15s; }
.concept-row.open .concept-chevron { transform: rotate(90deg); }
.concept-body {
  display: none; padding: 4px 14px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.concept-row.open .concept-body { display: block; }
.concept-chunk {
  padding: 10px 0; border-bottom: 1px dashed var(--border);
  font-family: var(--font-mono); font-size: 12px;
}
.concept-chunk:last-child { border-bottom: none; }
.concept-chunk-head {
  display: flex; gap: 8px; align-items: center; margin-bottom: 4px;
  color: var(--muted);
}
.concept-chunk-link {
  color: var(--text); cursor: pointer; text-decoration: none;
}
.concept-chunk-link:hover { color: var(--accent); text-decoration: underline; }
.concept-chunk-snippet {
  color: var(--text); opacity: 0.85; line-height: 1.55;
  font-family: var(--font-sans); font-size: 13px;
  white-space: pre-wrap; word-wrap: break-word;
}
.concepts-empty {
  text-align: center; color: var(--muted);
  font-family: var(--font-mono); font-size: 13px;
  padding: 60px 20px;
}

/* ── Concepts: List/Graph view toggle ─────────────────────────────────── */
.concepts-view-toggle {
  display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden; background: var(--bg2);
}
.concepts-view-btn {
  background: transparent; border: 0; color: var(--muted);
  padding: 6px 14px; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.concepts-view-btn.active { color: var(--text); background: var(--bg3); }
.concepts-view-btn + .concepts-view-btn { border-left: 1px solid var(--border); }

/* ──────────────────────────────────────────────────────────────────────────
   Concepts · Graph view  —  "Editorial Atlas"
   ────────────────────────────────────────────────────────────────────────── */

/* Theme-aware concept-kind palette: derived from the existing palette,
   so light/dark switching is automatic and contrast is hand-tuned. */
:root {
  --kind-method:     var(--accent);
  --kind-instrument: var(--bransfield);
  --kind-dataset:    var(--earthnote);
  --kind-quantity:   var(--coszo);

  --cg-grid:         var(--border);
  --cg-link:         var(--text-3);
  --cg-link-focus:   var(--accent);
  --cg-halo-opacity: 0.55;
  --cg-halo-blur:    7px;
}
:root[data-theme="light"] {
  --cg-halo-opacity: 0.30;     /* warm bright halos look ghostly on cream — pull back */
  --cg-halo-blur:    5px;
  --cg-link:         var(--text-3);
}

/* Outer canvas: large editorial plate with a faint engraved dot-grid.
   Solid var(--bg2) — no rgba ghosting in light mode. */
.concepts-graph-wrap {
  position: relative;
  width: 100%; height: 84vh; min-height: 600px;
  background-color: var(--bg2);
  background-image: radial-gradient(circle, var(--cg-grid) 0.9px, transparent 1px);
  background-size: 28px 28px;
  background-position: 0 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  isolation: isolate;
}

.concepts-graph-svg {
  width: 100%; height: 100%; display: block;
  cursor: grab;
}
.concepts-graph-svg:active { cursor: grabbing; }

/* ── Edges ─────────────────────────────────────────────────────────────── */
.cg-link {
  fill: none;
  stroke: var(--cg-link);
  stroke-opacity: 0.32;
  stroke-width: 1.1;
  transition: stroke 200ms ease, stroke-opacity 220ms ease, stroke-width 220ms ease;
}
.cg-link.is-faded   { stroke-opacity: 0.06; }
.cg-link.is-focused {
  stroke: var(--cg-link-focus);
  stroke-opacity: 0.85;
  stroke-width: 1.5;
}

/* ── Nodes ─────────────────────────────────────────────────────────────── */
.cg-node { cursor: pointer; transition: opacity 220ms ease; }
.cg-node.is-faded { opacity: 0.18; }

.cg-node-halo {
  fill: var(--node-color, var(--text-3));
  filter: blur(var(--cg-halo-blur));
  opacity: var(--cg-halo-opacity);
  transition: opacity 220ms ease;
}
.cg-node:hover       .cg-node-halo { opacity: calc(var(--cg-halo-opacity) + 0.25); }
.cg-node.is-focused  .cg-node-halo { opacity: calc(var(--cg-halo-opacity) + 0.35); }

.cg-node-core {
  fill: var(--node-color, var(--text-3));
  stroke: var(--bg2); stroke-width: 1.5;
  transition: stroke 180ms ease, stroke-width 180ms ease;
}
.cg-node.is-focused .cg-node-core { stroke: var(--text); stroke-width: 1.8; }

/* Note nodes: hollow rings — quieter than concepts, higher visual weight when focused */
.cg-node-note .cg-node-core {
  fill: var(--bg2);
  stroke: var(--node-color, var(--text-3));
  stroke-width: 1.8;
}
.cg-node-note.is-focused .cg-node-core {
  fill: var(--node-color, var(--text-3));
  stroke: var(--bg2);
}

/* Class-based palette — set --node-color so summary mode can override in CSS */
.cg-kind-method     { --node-color: var(--kind-method); }
.cg-kind-instrument { --node-color: var(--kind-instrument); }
.cg-kind-dataset    { --node-color: var(--kind-dataset); }
.cg-kind-quantity   { --node-color: var(--kind-quantity); }
.cg-proj-COSZO        { --node-color: var(--coszo); }
.cg-proj-BransfieldEQ { --node-color: var(--bransfield); }
.cg-proj-Earthnote    { --node-color: var(--earthnote); }

/* Summary mode: collapse non-hub nodes to neutral dots, hide their labels and
   halos, and dim edges. Active when nothing is filtered or searched. Hubs
   (is-top, degree >= 5) keep their color and label so the chart remains
   navigable at a glance. Selected/focused/hovered nodes also pop back. */
.cg-summary .cg-node:not(.is-top):not(.is-focused):not(.is-selected) {
  --node-color: var(--text-3);
}
.cg-summary .cg-node:not(.is-top):not(.is-focused):not(.is-selected) .cg-node-halo {
  opacity: 0;
}
.cg-summary .cg-node:not(.is-top):not(.is-focused):not(.is-selected) .cg-label {
  display: none;
}
.cg-summary .cg-link:not(.is-focused) { stroke-opacity: 0.07; }
.cg-summary .cg-node:not(.is-top):not(.is-focused):not(.is-selected) .cg-node-core {
  stroke-width: 1;
}
.cg-summary .cg-node-note:not(.is-top):not(.is-focused):not(.is-selected) .cg-node-core {
  fill: var(--text-3);
  stroke: var(--bg2);
}

/* Search input wrap + clear button (× appears once user has typed) */
.concepts-search-wrap {
  position: relative; flex: 1; min-width: 220px;
}
.concepts-search-wrap .concepts-search { width: 100%; padding-right: 32px; }
.concepts-search-clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: transparent; border: 0; cursor: pointer;
  color: var(--text-3); font-size: 16px; line-height: 1;
  padding: 4px 8px; display: none;
  font-family: var(--font-sans);
}
.concepts-search-clear:hover { color: var(--text); }
.concepts-search-wrap.has-text .concepts-search-clear { display: block; }

/* Pulse on the actively selected node — opacity only (SVG transform-origin trap) */
@keyframes cg-pulse {
  0%, 100% { opacity: calc(var(--cg-halo-opacity) + 0.40); }
  50%      { opacity: calc(var(--cg-halo-opacity) + 0.10); }
}
.cg-node.is-selected .cg-node-halo { animation: cg-pulse 2.4s ease-in-out infinite; }

/* ── Labels ────────────────────────────────────────────────────────────── */
/* Concept labels: italic serif — they are the *subjects* of this atlas */
.cg-label {
  pointer-events: none; user-select: none;
  paint-order: stroke fill;
  stroke: var(--bg2); stroke-width: 4px; stroke-linejoin: round;
}
.cg-label.is-concept {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.005em;
  fill: var(--text);
}
.cg-label.is-note {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  fill: var(--text-2);
  opacity: 0;
  transition: opacity 180ms ease;
}
.cg-node:hover       .cg-label.is-note,
.cg-node.is-focused  .cg-label.is-note { opacity: 1; }
.cg-label.is-faded { opacity: 0.18; }

/* ── HUD: editorial chart key ──────────────────────────────────────────── */
.cg-hud {
  position: absolute; top: 18px; left: 20px;
  display: flex; flex-direction: column; gap: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px 12px;
  min-width: 168px;
  max-width: 240px;
  z-index: 4;
}
.cg-hud-toggle {
  position: absolute; top: 6px; right: 8px;
  background: transparent; border: 0; cursor: pointer;
  color: var(--text-3); font-size: 16px; line-height: 1;
  padding: 4px 6px;
  font-family: var(--font-sans);
}
.cg-hud-toggle:hover { color: var(--text); }
.cg-hud.is-collapsed { padding: 8px 14px; min-width: 0; }
.cg-hud.is-collapsed > :not(.cg-hud-toggle):not(.cg-hud-collapsed-label) { display: none; }
.cg-hud-collapsed-label {
  display: none;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-2); letter-spacing: 0.16em;
  text-transform: uppercase;
  padding-right: 22px;
}
.cg-hud.is-collapsed .cg-hud-collapsed-label { display: block; }
.cg-hud-eyebrow {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.18em;
  margin-bottom: 6px;
}
.cg-hud-title {
  font-family: var(--font-serif); font-style: italic;
  font-size: 15px; font-weight: 500; color: var(--text);
  letter-spacing: -0.005em; margin-bottom: 12px;
}
.cg-hud-stats {
  display: grid; grid-template-columns: auto 1fr;
  column-gap: 12px; row-gap: 4px;
  padding-bottom: 12px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.cg-hud-stat-num {
  font-family: var(--font-mono); font-size: 13px;
  color: var(--text); font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.cg-hud-stat-label {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-2); letter-spacing: 0.06em;
  text-transform: uppercase;
  align-self: center;
}
.cg-hud-section {
  display: flex; flex-direction: column; gap: 5px;
}
.cg-hud-section + .cg-hud-section {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.cg-hud-section-eyebrow {
  font-family: var(--font-mono); font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.16em;
  margin-bottom: 2px;
}
.cg-hud-row {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-2); letter-spacing: 0.02em;
}
.cg-hud-dot {
  width: 9px; height: 9px; border-radius: 50%;
  flex-shrink: 0;
  background: var(--swatch, var(--text-3));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--swatch, var(--text-3)) 18%, transparent);
}

/* Status hint, bottom-right corner of the plate */
.cg-status {
  position: absolute; bottom: 16px; right: 20px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.14em; text-transform: uppercase;
  pointer-events: none;
  text-align: right;
  max-width: 60%;
}

.cg-controls {
  position: absolute; top: 14px; right: 14px;
  display: flex; gap: 6px;
  z-index: 10;
}
.cg-ctrl-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-2);
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  transition: border-color 0.14s, color 0.14s;
}
.cg-ctrl-btn:hover { border-color: var(--border-2); color: var(--text); }
#cg-wrap:fullscreen { background: var(--bg); }
#cg-wrap:-webkit-full-screen { background: var(--bg); }

/* ── Side panel: opaque editorial card ────────────────────────────────── */
.cg-side {
  position: absolute; top: 18px; right: 18px; bottom: 18px;
  width: 360px; max-width: calc(100% - 36px);
  background: var(--bg);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  padding: 28px 26px 22px;
  overflow-y: auto;
  color: var(--text);
  display: none;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
}
:root[data-theme="light"] .cg-side {
  box-shadow: 0 12px 36px rgba(40, 40, 60, 0.10);
}
.cg-side.open {
  display: block;
  animation: cg-side-in 280ms cubic-bezier(.2,.7,.2,1);
}
@keyframes cg-side-in {
  from { transform: translateX(14px); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}
.cg-side-close {
  position: absolute; top: 14px; right: 16px;
  cursor: pointer;
  background: transparent; border: 0;
  color: var(--text-3);
  font-size: 22px; line-height: 1; padding: 4px 6px;
  font-family: var(--font-sans);
}
.cg-side-close:hover { color: var(--text); }

.cg-side-kind {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.18em;
  margin-bottom: 10px;
  color: var(--text-3);
}
.cg-side-title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 26px; font-weight: 500;
  color: var(--text);
  line-height: 1.15; letter-spacing: -0.01em;
  margin-bottom: 6px;
  word-break: break-word;
}
.cg-side-meta {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.cg-side-list { display: flex; flex-direction: column; gap: 14px; }

.cg-side-open-btn {
  appearance: none; cursor: pointer;
  background: var(--bg3);
  border: 1px solid var(--border-2);
  color: var(--text);
  padding: 10px 14px; border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em;
  width: 100%; margin-bottom: 16px;
  transition: background 160ms ease, border-color 160ms ease;
}
.cg-side-open-btn:hover {
  background: var(--bg4);
  border-color: var(--text-3);
}
.cg-side-conceptrow {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
  font-family: var(--font-sans);
}
.cg-side-conceptrow:last-child { border-bottom: 0; }
.cg-side-conceptrow-dot {
  width: 9px; height: 9px; border-radius: 50%;
}
.cg-side-conceptrow-label {
  font-family: var(--font-serif); font-style: italic;
  font-size: 14px; color: var(--text);
}
.cg-side-conceptrow-kind {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.12em;
}
</style>

// ── Date parsing ────────────────────────────────────────────────────────────
// Matches "MM-DD-YY Notes.md" → { year, month (0-based), day, key }
function parseNoteDate(filename) {
  const m = filename.match(/^(\d{2})-(\d{2})-(\d{2})\s+Notes\.md$/i);
  if (!m) return null;
  const year  = 2000 + parseInt(m[3]);
  const month = parseInt(m[1]) - 1;  // 0-based
  const day   = parseInt(m[2]);
  const key   = `${year}-${m[1]}-${m[2]}`;
  return { year, month, day, key };
}

// ── Build date → notes map ─────────────────────────────────────────────────

  const map = {};
  for (const [proj, cfg] of Object.entries(PROJECTS)) {
    for (const fn of cfg.files) {
      const d = parseNoteDate(fn);
      if (!d) continue;
      if (!map[d.key]) map[d.key] = [];
      map[d.key].push({ project: proj, filename: fn, color: cfg.color });
    }
  }
  return map;
}
