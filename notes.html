<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes — Maleen Kidiwela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>

:root {
  /* Surfaces */
  --bg:           #06101c;
  --bg2:          #0b1828;
  --bg3:          #101f32;
  --bg4:          #162840;

  /* Borders */
  --border:       #1c3050;
  --border-2:     #2c4870;

  /* Primary interactive accent — electric teal */
  --accent:       #18cdd8;
  --accent-dim:   #0b5a62;
  --accent-glow:  rgba(24, 205, 216, 0.10);

  /* Project accents */
  --coszo:          #f5a833;
  --coszo-dim:      #7a4c12;
  --coszo-glow:     rgba(245, 168, 51, 0.10);
  --bransfield:     #a37cff;
  --bransfield-dim: #42208a;
  --bransfield-glow:rgba(163, 124, 255, 0.10);
  --earthnote:      #38dba0;
  --earthnote-dim:  #186048;
  --earthnote-glow: rgba(56, 219, 160, 0.10);

  /* Text */
  --text:       #ddeef8;
  --text-2:     #7a9ab8;
  --text-3:     #405870;
  --text-muted: #628098;    /* alias used in JS inline styles */

  /* Layout */
  --sidebar-w: 304px;
  --header-h:  58px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Spectral', Georgia, serif;
  font-size: 1rem;
  line-height: 1.65;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Deep-ocean atmosphere ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 90% 45% at 50% -5%, rgba(14, 100, 160, 0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 100% 100%, rgba(18, 205, 216, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse 40% 50% at 0% 60%, rgba(56, 219, 160, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── Top bar ── */
header {
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}

header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--accent) 25%,
    var(--accent) 75%,
    transparent 100%);
  opacity: 0.22;
}

.wordmark {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  text-decoration: none;
  white-space: nowrap;
}

.wordmark .accent-dot { color: var(--accent); }

.divider {
  width: 1px;
  height: 22px;
  background: var(--border);
  flex-shrink: 0;
}

.project-tabs {
  display: flex;
  gap: 6px;
  flex: 1;
}

.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--text-2);
  transition: all 0.18s ease;
  background: transparent;
  white-space: nowrap;
}

.tab:hover {
  color: var(--text);
  background: var(--bg3);
  border-color: var(--border-2);
}

.tab[data-project="COSZO"].active {
  color: var(--coszo);
  background: var(--coszo-glow);
  border-color: var(--coszo-dim);
}

.tab[data-project="BransfieldEQ"].active {
  color: var(--bransfield);
  background: var(--bransfield-glow);
  border-color: var(--bransfield-dim);
}

.tab[data-project="Earthnote"].active {
  color: var(--earthnote);
  background: var(--earthnote-glow);
  border-color: var(--earthnote-dim);
}

.tab-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-coszo      { background: var(--coszo);      box-shadow: 0 0 7px var(--coszo); }
.dot-bransfield { background: var(--bransfield);  box-shadow: 0 0 7px var(--bransfield); }
.dot-earthnote  { background: var(--earthnote);   box-shadow: 0 0 7px var(--earthnote); }

.back-link {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  text-decoration: none;
  letter-spacing: 0.07em;
  transition: color 0.15s;
  white-space: nowrap;
}
.back-link:hover { color: var(--text-2); }

/* ── Body layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ── Sidebar ── */
aside {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 13px 18px 11px;
  border-bottom: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-3);
}

.file-tree {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0;
}

.file-tree::-webkit-scrollbar { width: 3px; }
.file-tree::-webkit-scrollbar-track { background: transparent; }
.file-tree::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

.folder { margin-bottom: 4px; }

.folder-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 18px;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  transition: color 0.12s;
  user-select: none;
  letter-spacing: 0.01em;
}

.folder-label:hover { color: var(--accent); }

.folder-label .chevron {
  font-size: 9px;
  transition: transform 0.2s ease;
  color: var(--text-3);
  width: 10px;
  flex-shrink: 0;
  text-align: center;
  display: inline-block;
}

.folder.open .chevron { transform: rotate(90deg); }

.folder-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.file-list {
  display: none;
  padding-left: 16px;
  padding-bottom: 6px;
}

.folder.open .file-list { display: block; }

.file-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 16px 5px 10px;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--text-2);
  border-left: 2px solid transparent;
  transition: all 0.14s ease;
  border-radius: 0 4px 4px 0;
  line-height: 1.45;
}

.file-item:hover {
  color: var(--text);
  border-left-color: var(--border-2);
  background: rgba(220, 235, 255, 0.03);
  transform: translateX(2px);
}

.file-item.active {
  color: var(--text);
  border-left-color: var(--accent);
  background: var(--accent-glow);
}

.file-icon {
  color: var(--text-3);
  font-size: 10px;
  flex-shrink: 0;
  margin-top: 3px;
}

.file-item.active .file-icon { color: var(--accent); }

/* ── Main content ── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-header {
  padding: 11px 40px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  flex-shrink: 0;
  min-height: 44px;
}

.breadcrumb {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  flex-wrap: wrap;
}

.breadcrumb span { color: var(--text-2); }

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 48px 80px 100px;
}

.content-scroll::-webkit-scrollbar { width: 4px; }
.content-scroll::-webkit-scrollbar-track { background: transparent; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  color: var(--text-3);
  text-align: center;
}

.empty-glyph {
  font-size: 40px;
  opacity: 0.22;
  margin-bottom: 8px;
}

.empty-state p {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.07em;
}

/* ── Project landing cards ── */
.project-landing {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 16px;
  padding: 40px 48px;
  align-content: start;
}

.project-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px 24px;
  background: var(--bg2);
  cursor: pointer;
  transition: all 0.18s ease;
  position: relative;
  overflow: hidden;
}

.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 8px 8px 0 0;
}

.project-card.coszo::before      { background: var(--coszo); }
.project-card.bransfield::before { background: var(--bransfield); }
.project-card.earthnote::before  { background: var(--earthnote); }

.project-card:hover {
  transform: translateY(-2px);
}

.project-card.coszo:hover {
  border-color: var(--coszo-dim);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px var(--coszo-dim);
}
.project-card.bransfield:hover {
  border-color: var(--bransfield-dim);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px var(--bransfield-dim);
}
.project-card.earthnote:hover {
  border-color: var(--earthnote-dim);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px var(--earthnote-dim);
}

.card-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.card-label.coszo      { color: var(--coszo); }
.card-label.bransfield { color: var(--bransfield); }
.card-label.earthnote  { color: var(--earthnote); }

.card-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.25;
}

.card-desc {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-2);
  line-height: 1.75;
}

.card-count {
  margin-top: 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Markdown body ── */
.md-body {
  max-width: 740px;
  font-size: 16px;
  line-height: 1.85;
}

.md-body h1 {
  font-family: 'Fraunces', serif;
  font-size: 34px;
  font-weight: 400;
  color: #eff0e8;
  margin-bottom: 26px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  line-height: 1.22;
  letter-spacing: -0.015em;
}

.md-body h2 {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 400;
  color: #dddbd0;
  margin: 44px 0 16px;
  line-height: 1.28;
  letter-spacing: -0.01em;
}

.md-body h3 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 34px 0 12px;
  font-weight: 400;
}

.md-body h4 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  margin: 24px 0 10px;
  letter-spacing: 0.05em;
}

.md-body p {
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.85;
  font-size: 16px;
}

.md-body ul, .md-body ol {
  margin: 0 0 16px 22px;
  color: var(--text);
  line-height: 1.85;
}

.md-body li { margin-bottom: 5px; font-size: 16px; }

.md-body li input[type="checkbox"] {
  margin-right: 8px;
  accent-color: var(--accent);
}

.md-body code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 3px;
  color: #a8d8c0;
}

.md-body pre {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-dim);
  padding: 20px 24px;
  border-radius: 6px;
  overflow-x: auto;
  margin-bottom: 22px;
}

.md-body pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: 13.5px;
  color: #c0d8c4;
  line-height: 1.72;
}

.md-body blockquote {
  border-left: 3px solid var(--accent-dim);
  padding: 10px 20px;
  margin: 0 0 16px;
  color: var(--text-2);
  font-style: italic;
  background: var(--accent-glow);
  border-radius: 0 6px 6px 0;
}

.md-body table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 24px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
}

.md-body th {
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 10px 14px;
  text-align: left;
  color: var(--accent);
  font-weight: 400;
  letter-spacing: 0.08em;
  font-size: 11px;
  text-transform: uppercase;
}

.md-body td {
  border: 1px solid var(--border);
  padding: 9px 14px;
  color: var(--text);
  line-height: 1.6;
}

.md-body tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

.md-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 36px 0;
}

.md-body a { color: var(--accent); text-decoration: none; }
.md-body a:hover { text-decoration: underline; }

.md-body strong { color: #f0ece0; font-weight: 600; }
.md-body em { color: var(--text-2); }

/* ── Loading ── */
.loading {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 52px 0;
}

.loading-dot {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 10px var(--accent);
}

@keyframes pulse {
  0%, 100% { opacity: 0.2; transform: scale(0.75); }
  50%       { opacity: 1;   transform: scale(1.2); }
}

/* ── Status bar ── */
.statusbar {
  height: 26px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  flex-shrink: 0;
  z-index: 10;
}

.status-item { display: flex; align-items: center; gap: 6px; }

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--earthnote);
  box-shadow: 0 0 5px var(--earthnote);
}

/* ── Entrance animation ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

header    { animation: fadeUp 0.38s ease both; }
aside     { animation: fadeUp 0.38s ease 0.07s both; }
main      { animation: fadeUp 0.38s ease 0.13s both; }
.statusbar{ animation: fadeUp 0.38s ease 0.17s both; }

</style>
</head>
<body>

<header>
  <a href="index.html" class="wordmark">MK<span class="accent-dot"> · </span>Research</a>
  <div class="divider"></div>
  <nav class="project-tabs" id="project-tabs">
    <button class="tab active" data-project="COSZO" onclick="selectProject('COSZO', this)">
      <span class="tab-dot dot-coszo"></span>COSZO
    </button>
    <button class="tab" data-project="BransfieldEQ" onclick="selectProject('BransfieldEQ', this)">
      <span class="tab-dot dot-bransfield"></span>BransfieldEQ
    </button>
    <button class="tab" data-project="Earthnote" onclick="selectProject('Earthnote', this)">
      <span class="tab-dot dot-earthnote"></span>Earthnote
    </button>
  </nav>
  <a href="index.html" class="back-link">← portfolio</a>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-header" id="sidebar-label">Explorer</div>
    <div class="file-tree" id="file-tree"></div>
  </aside>

  <main>
    <div class="content-header">
      <div class="breadcrumb" id="breadcrumb">
        <span id="bc-project">—</span>
      </div>
    </div>
    <div class="content-scroll" id="content-scroll">
      <div id="content-area"></div>
    </div>
  </main>
</div>

<div class="statusbar">
  <div class="status-item"><div class="status-dot"></div> <span id="status-text">Select a file</span></div>
</div>

<script>
// ── Project config ─────────────────────────────────────────────────────────
const PROJECTS = {
  COSZO: {
    label:  'COSZO',
    color:  'coszo',
    accent: '#f5a833',
    desc:   'OOI tidal pressure data pipeline\nfrom instrument to EarthScope archive.',
    files: [ // AUTO-FILES:COSZO:START
      "04-01-26 Notes.md",
      "04-02-26 Notes.md",
      "04-03-26 Notes.md",
      "04-06-26 Notes.md",
      "04-07-26 Notes.md",
      "COSZO Data Collection \u2014 Code Walkthrough.md",
      "Cascadia Offshore Subduction Zone Observatory.md",
      "SeisFix \u2014 Implementation Plan.md",
      "non_tier1_ooi_instrument_data_notes.md",
      "phase_1_plan.md",
    ] // AUTO-FILES:COSZO:END
  },
  BransfieldEQ: {
    label:  'BransfieldEQ',
    color:  'bransfield',
    accent: '#a37cff',
    desc:   'Seismicity analysis of the\nBransfield Basin, Antarctica.',
    files: [ // AUTO-FILES:BransfieldEQ:START
      "Bransfield Basin Earthquakes.md",
    ] // AUTO-FILES:BransfieldEQ:END
  },
  Earthnote: {
    label:  'Earthnote',
    color:  'earthnote',
    accent: '#38dba0',
    desc:   'Cascadia dv/v ambient noise\ncorrelation and velocity changes.',
    files: [ // AUTO-FILES:Earthnote:START
      "Cascadia dv.v.md",
      "PROJECT_PLAN.md",
    ] // AUTO-FILES:Earthnote:END
  }
};

// ── State ──────────────────────────────────────────────────────────────────
let activeProject = 'COSZO';
let activeFile    = null;

// ── Render sidebar ─────────────────────────────────────────────────────────
function renderSidebar(project) {
  const cfg  = PROJECTS[project];
  const tree = document.getElementById('file-tree');
  document.getElementById('sidebar-label').textContent = cfg.label.toUpperCase();

  const folder = document.createElement('div');
  folder.className = 'folder open';

  const dotClass = `dot-${cfg.color}`;
  folder.innerHTML = `
    <div class="folder-label" onclick="this.parentElement.classList.toggle('open')">
      <span class="chevron">▶</span>
      <span class="folder-dot ${dotClass}"></span>
      <span class="folder-name">${project}</span>
    </div>
    <div class="file-list" id="file-list"></div>
  `;
  tree.innerHTML = '';
  tree.appendChild(folder);

  const list = folder.querySelector('#file-list');
  cfg.files.forEach(filename => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.file = filename;
    item.innerHTML = `<span class="file-icon">◈</span>${filename}`;
    item.onclick = () => loadFile(project, filename, item);
    list.appendChild(item);
  });
}

// ── Project switch ─────────────────────────────────────────────────────────
function selectProject(project, tabEl) {
  activeProject = project;
  activeFile    = null;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  renderSidebar(project);
  showLanding(project);

  document.getElementById('bc-project').textContent = project;
  document.getElementById('status-text').textContent = `${PROJECTS[project].files.length} files`;
}

// ── Landing screen ─────────────────────────────────────────────────────────
function showLanding(project) {
  const cfg = PROJECTS[project];
  const area = document.getElementById('content-area');

  area.innerHTML = `
    <div class="project-landing">
      <div class="project-card ${cfg.color}" onclick="">
        <div class="card-label ${cfg.color}">${cfg.label}</div>
        <div class="card-title">${cfg.label}</div>
        <div class="card-desc" style="white-space:pre-line">${cfg.desc}</div>
        <div class="card-count">◈ ${cfg.files.length} note${cfg.files.length !== 1 ? 's' : ''}</div>
      </div>
      ${cfg.files.map(f => `
        <div class="project-card ${cfg.color}" style="padding:18px 24px;cursor:pointer"
             onclick="loadFileByName('${project}','${f.replace(/'/g,"\\'")}')">
          <div class="card-label ${cfg.color}" style="margin-bottom:6px">◈ md</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);line-height:1.5">${f}</div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>`;
}

// ── Load a file ────────────────────────────────────────────────────────────
async function loadFile(project, filename, itemEl) {
  // Update active state
  document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');
  activeFile = filename;

  // Breadcrumb
  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>
     <span style="color:var(--text-muted)">›</span>
     <span>${filename}</span>`;

  // Status
  document.getElementById('status-text').textContent = `Loading ${filename}…`;

  // Show loading
  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="loading"><div class="loading-dot"></div>Fetching ${filename}…</div>`;

  const path = `/notes/${encodeURIComponent(project)}/${encodeURIComponent(filename)}`;

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();

    // Strip Obsidian image embeds (![[...]]) before rendering
    const cleaned = md.replace(/!\[\[([^\]]+)\]\]/g, '_[image: $1]_');

    area.innerHTML = `<div class="md-body">${marked.parse(cleaned)}</div>`;

    // Make checkboxes non-interactive (display only)
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.disabled = true);

    document.getElementById('content-scroll').scrollTop = 0;
    document.getElementById('status-text').textContent = filename;
  } catch (err) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-glyph">⚠</div>
        <p>Could not load file</p>
        <p style="color:var(--text-muted);font-size:10px;margin-top:4px">${err.message}</p>
        <p style="color:var(--text-muted);font-size:10px">Path: ${path}</p>
      </div>`;
    document.getElementById('status-text').textContent = 'Error loading file';
  }
}

function loadFileByName(project, filename) {
  const items = document.querySelectorAll('.file-item');
  let match = null;
  items.forEach(i => { if (i.dataset.file === filename) match = i; });
  loadFile(project, filename, match);
}

renderSidebar('COSZO');
showLanding('COSZO');
document.getElementById('bc-project').textContent = 'COSZO';
document.getElementById('status-text').textContent = `${PROJECTS['COSZO'].files.length} files`;

// marked config
marked.setOptions({ breaks: true, gfm: true });
</script>
