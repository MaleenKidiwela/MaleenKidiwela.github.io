<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes — Maleen Kidiwela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg:        #0c0f14;
    --bg2:       #111520;
    --bg3:       #161c28;
    --border:    #1e2535;
    --amber:     #e8a94a;
    --amber-dim: #7a5520;
    --text:      #c8cdd8;
    --text-dim:  #5a6070;
    --text-muted:#3a404e;
    --green:     #4a9e6e;
    --blue:      #4a7ebb;
    --red:       #c05a5a;
    --sidebar-w: 260px;
    --header-h:  52px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lora', Georgia, serif;
    font-size: 14px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Grid overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Top bar ── */
  header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0.9;
    text-decoration: none;
  }

  .divider {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .project-tabs {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    transition: all 0.15s;
    background: transparent;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); background: var(--bg3); border-color: var(--border); }

  .tab.active {
    color: var(--amber);
    background: rgba(232,169,74,0.08);
    border-color: var(--amber-dim);
  }

  .tab-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-coszo    { background: var(--amber); }
  .dot-bransfield { background: var(--blue); }
  .dot-earthnote  { background: var(--green); }

  .back-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--text-dim); }

  /* ── Body layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ── Sidebar ── */
  aside {
    width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .file-tree {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .file-tree::-webkit-scrollbar { width: 4px; }
  .file-tree::-webkit-scrollbar-track { background: transparent; }
  .file-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .folder {
    margin-bottom: 2px;
  }

  .folder-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 16px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    transition: color 0.12s;
    user-select: none;
  }

  .folder-label:hover { color: var(--text); }

  .folder-label .chevron {
    font-size: 9px;
    transition: transform 0.2s;
    color: var(--text-muted);
    width: 10px;
    display: inline-block;
    text-align: center;
  }

  .folder.open .chevron { transform: rotate(90deg); }

  .folder-name {
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .folder-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .file-list {
    display: none;
    padding-left: 28px;
  }

  .folder.open .file-list { display: block; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 16px 4px 0;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    border-left: 2px solid transparent;
    transition: all 0.12s;
    border-radius: 0 2px 2px 0;
  }

  .file-item:hover { color: var(--text-dim); border-left-color: var(--border); }

  .file-item.active {
    color: var(--amber);
    border-left-color: var(--amber);
    background: rgba(232,169,74,0.05);
  }

  .file-icon { color: var(--text-muted); font-size: 10px; flex-shrink: 0; }
  .file-item.active .file-icon { color: var(--amber-dim); }

  /* ── Main content ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg2);
    flex-shrink: 0;
  }

  .breadcrumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  .breadcrumb span { color: var(--text-dim); }

  .content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 40px 64px 80px;
  }

  .content-scroll::-webkit-scrollbar { width: 5px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  .empty-glyph {
    font-size: 36px;
    opacity: 0.3;
    margin-bottom: 8px;
  }

  .empty-state p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
  }

  /* ── Project landing cards ── */
  .project-landing {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 40px;
    align-content: start;
  }

  .project-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px;
    background: var(--bg2);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .project-card.coszo::before    { background: var(--amber); }
  .project-card.bransfield::before { background: var(--blue); }
  .project-card.earthnote::before  { background: var(--green); }

  .project-card:hover { border-color: var(--text-muted); transform: translateY(-1px); }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card-label.coszo    { color: var(--amber); }
  .card-label.bransfield { color: var(--blue); }
  .card-label.earthnote  { color: var(--green); }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .card-count {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Markdown styles ── */
  .md-body { max-width: 720px; }

  .md-body h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    color: #e8dcc8;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    line-height: 1.3;
  }

  .md-body h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: #d4c8b0;
    margin: 36px 0 14px;
    font-weight: 600;
  }

  .md-body h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 28px 0 10px;
    font-weight: 500;
  }

  .md-body h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin: 20px 0 8px;
  }

  .md-body p {
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.8;
  }

  .md-body ul, .md-body ol {
    margin: 0 0 14px 20px;
    color: var(--text);
    line-height: 1.8;
  }

  .md-body li { margin-bottom: 4px; }

  .md-body li input[type="checkbox"] {
    margin-right: 6px;
    accent-color: var(--amber);
  }

  .md-body code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 2px;
    color: #b8d4a8;
  }

  .md-body pre {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber-dim);
    padding: 16px 20px;
    border-radius: 3px;
    overflow-x: auto;
    margin-bottom: 18px;
  }

  .md-body pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 12px;
    color: #c8d8b8;
    line-height: 1.7;
  }

  .md-body blockquote {
    border-left: 3px solid var(--amber-dim);
    padding: 8px 16px;
    margin: 0 0 14px;
    color: var(--text-dim);
    font-style: italic;
    background: rgba(232,169,74,0.04);
  }

  .md-body table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }

  .md-body th {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    color: var(--amber);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .md-body td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    color: var(--text);
  }

  .md-body tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  .md-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  .md-body a { color: var(--amber); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }

  .md-body strong { color: #e0d4bc; font-weight: 600; }
  .md-body em { color: var(--text-dim); }

  /* ── Loading state ── */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 40px 0;
  }

  .loading-dot {
    width: 5px; height: 5px;
    background: var(--amber);
    border-radius: 50%;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* ── Status bar ── */
  .statusbar {
    height: 22px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
    z-index: 10;
  }

  .status-item { display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

</style>
</head>
<body>

<header>
  <a href="index.html" class="wordmark">MK · Research</a>
  <div class="divider"></div>
  <nav class="project-tabs" id="project-tabs">
    <button class="tab active" data-project="COSZO" onclick="selectProject('COSZO', this)">
      <span class="tab-dot dot-coszo"></span>COSZO
    </button>
    <button class="tab" data-project="BransfieldEQ" onclick="selectProject('BransfieldEQ', this)">
      <span class="tab-dot dot-bransfield"></span>BransfieldEQ
    </button>
    <button class="tab" data-project="Earthnote" onclick="selectProject('Earthnote', this)">
      <span class="tab-dot dot-earthnote"></span>Earthnote
    </button>
  </nav>
  <a href="index.html" class="back-link">← portfolio</a>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-header" id="sidebar-label">Explorer</div>
    <div class="file-tree" id="file-tree"></div>
  </aside>

  <main>
    <div class="content-header">
      <div class="breadcrumb" id="breadcrumb">
        <span id="bc-project">—</span>
      </div>
    </div>
    <div class="content-scroll" id="content-scroll">
      <div id="content-area"></div>
    </div>
  </main>
</div>

<div class="statusbar">
  <div class="status-item"><div class="status-dot"></div> <span id="status-text">Select a file</span></div>
</div>

<script>
// ── Project config ─────────────────────────────────────────────────────────
const PROJECTS = {
  COSZO: {
    label:  'COSZO',
    color:  'coszo',
    accent: '#e8a94a',
    desc:   'OOI tidal pressure data pipeline\nfrom instrument to EarthScope archive.',
    files: [
      '04-01-26 Notes.md',
      '04-02-26 Notes.md',
      '04-03-26 Notes.md',
      '04-06-26 Notes.md',
      '04-07-26 Notes.md',
      'phase_1_plan.md',
      'COSZO Data Collection — Code Walkthrough.md',
      'Cascadia Offshore Subduction Zone Observatory.md',
    ]
  },
  BransfieldEQ: {
    label:  'BransfieldEQ',
    color:  'bransfield',
    accent: '#4a7ebb',
    desc:   'Seismicity analysis of the\nBransfield Basin, Antarctica.',
    files: [
      'Bransfield Basin Earthquakes.md',
    ]
  },
  Earthnote: {
    label:  'Earthnote',
    color:  'earthnote',
    accent: '#4a9e6e',
    desc:   'Cascadia dv/v ambient noise\ncorrelation and velocity changes.',
    files: [
      'Cascadia dv.v.md',
      'PROJECT_PLAN.md',
    ]
  }
};

// ── State ──────────────────────────────────────────────────────────────────
let activeProject = 'COSZO';
let activeFile    = null;

// ── Render sidebar ─────────────────────────────────────────────────────────
function renderSidebar(project) {
  const cfg  = PROJECTS[project];
  const tree = document.getElementById('file-tree');
  document.getElementById('sidebar-label').textContent = cfg.label.toUpperCase();

  const folder = document.createElement('div');
  folder.className = 'folder open';

  const dotClass = `dot-${cfg.color}`;
  folder.innerHTML = `
    <div class="folder-label" onclick="this.parentElement.classList.toggle('open')">
      <span class="chevron">▶</span>
      <span class="folder-dot ${dotClass}"></span>
      <span class="folder-name">${project}</span>
    </div>
    <div class="file-list" id="file-list"></div>
  `;
  tree.innerHTML = '';
  tree.appendChild(folder);

  const list = folder.querySelector('#file-list');
  cfg.files.forEach(filename => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.file = filename;
    item.innerHTML = `<span class="file-icon">◈</span>${filename}`;
    item.onclick = () => loadFile(project, filename, item);
    list.appendChild(item);
  });
}

// ── Project switch ─────────────────────────────────────────────────────────
function selectProject(project, tabEl) {
  activeProject = project;
  activeFile    = null;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  renderSidebar(project);
  showLanding(project);

  document.getElementById('bc-project').textContent = project;
  document.getElementById('status-text').textContent = `${PROJECTS[project].files.length} files`;
}

// ── Landing screen ─────────────────────────────────────────────────────────
function showLanding(project) {
  const cfg = PROJECTS[project];
  const area = document.getElementById('content-area');

  area.innerHTML = `
    <div class="project-landing">
      <div class="project-card ${cfg.color}" onclick="">
        <div class="card-label ${cfg.color}">${cfg.label}</div>
        <div class="card-title">${cfg.label}</div>
        <div class="card-desc" style="white-space:pre-line">${cfg.desc}</div>
        <div class="card-count">◈ ${cfg.files.length} note${cfg.files.length !== 1 ? 's' : ''}</div>
      </div>
      ${cfg.files.map(f => `
        <div class="project-card ${cfg.color}" style="padding:18px 24px;cursor:pointer"
             onclick="loadFileByName('${project}','${f.replace(/'/g,"\\'")}')">
          <div class="card-label ${cfg.color}" style="margin-bottom:6px">◈ md</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);line-height:1.5">${f}</div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>`;
}

// ── Load a file ────────────────────────────────────────────────────────────
async function loadFile(project, filename, itemEl) {
  // Update active state
  document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');
  activeFile = filename;

  // Breadcrumb
  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>
     <span style="color:var(--text-muted)">›</span>
     <span>${filename}</span>`;

  // Status
  document.getElementById('status-text').textContent = `Loading ${filename}…`;

  // Show loading
  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="loading"><div class="loading-dot"></div>Fetching ${filename}…</div>`;

  const path = `/notes/${encodeURIComponent(project)}/${encodeURIComponent(filename)}`;

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();

    // Strip Obsidian image embeds (![[...]]) before rendering
    const cleaned = md.replace(/!\[\[([^\]]+)\]\]/g, '_[image: $1]_');

    area.innerHTML = `<div class="md-body">${marked.parse(cleaned)}</div>`;

    // Make checkboxes non-interactive (display only)
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.disabled = true);

    document.getElementById('content-scroll').scrollTop = 0;
    document.getElementById('status-text').textContent = filename;
  } catch (err) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-glyph">⚠</div>
        <p>Could not load file</p>
        <p style="color:var(--text-muted);font-size:10px;margin-top:4px">${err.message}</p>
        <p style="color:var(--text-muted);font-size:10px">Path: ${path}</p>
      </div>`;
    document.getElementById('status-text').textContent = 'Error loading file';
  }
}

function loadFileByName(project, filename) {
  const items = document.querySelectorAll('.file-item');
  let match = null;
  items.forEach(i => { if (i.dataset.file === filename) match = i; });
  loadFile(project, filename, match);
}

// ── Init ───────────────────────────────────────────────────────────────────
renderSidebar('COSZO');
showLanding('COSZO');
document.getElementById('bc-project').textContent = 'COSZO';
document.getElementById('status-text').textContent = `${PROJECTS['COSZO'].files.length} files`;

// marked config
marked.setOptions({ breaks: true, gfm: true });
</script>
</body>
</html>
