// ── Constellation: build nodes & physics ───────────────────────────────────
function buildConstellationNodes() {
  const projectKeys = Object.keys(PROJECTS);
  const nodes = [];

  projectKeys.forEach((proj, pIdx) => {
    const cfg = PROJECTS[proj];
    cfg.files.forEach((filename, fIdx) => {
      const d = parseNoteDate(filename);
      const isHtml = filename.endsWith('.html');
      // Pinned project anchors get a bigger radius
      // Anchor = the file with the most outgoing wikilinks in the project,
      // computed at sync time and written into cfg.anchor by the regenerator.
      const isAnchor = !!cfg.anchor && cfg.anchor === filename;
      nodes.push({
        id: `${proj}/${filename}`,
        project: proj,
        projectIdx: pIdx,
        filename,
        color: cfg.color,
        accent: cfg.accent,
        date: d ? d.key : null,
        isAnchor,
        isHtml,
        r: isAnchor ? 9 : (d ? 5.2 : 6),
        pinned: isAnchor,
        x: 0, y: 0, vx: 0, vy: 0
      });
    });
  });

  return nodes;
}

function initConstellation() {
  const canvas  = document.getElementById('constellation-canvas');
  const tooltip = document.getElementById('constellation-tooltip');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const nodes = buildConstellationNodes();

  // Initial scatter
  const stage = document.getElementById('constellation-stage');
  const rect = stage.getBoundingClientRect();
  nodes.forEach(n => {
    const pIdx = n.projectIdx;
    const numP = Object.keys(PROJECTS).length;
    const cx = rect.width  * (0.30 + 0.20 * pIdx);
    const cy = rect.height * (0.50 + (pIdx % 2 === 0 ? -0.05 : 0.05));
    n.x = cx + (Math.random() - 0.5) * 180;
    n.y = cy + (Math.random() - 0.5) * 140;
  });

  __constellation = {
    nodes, canvas, ctx, tooltip,
    dpr: 1, w: 0, h: 0,
    hoverId: null,
    hoverCentroid: -1,
    highlightKey: null,
    rafId: null,
    t: 0,
    centroids: [] // filled after first resize
  };

  resizeConstellationCanvas();
  initCentroids();
  window.addEventListener('resize', resizeConstellationCanvas);

  // Pointer events cover mouse + touch uniformly
  canvas.addEventListener('pointermove', onConstellationPointerMove);
  canvas.addEventListener('pointerleave', () => {
    if (!__constellation || __constellation.drag) return;
    __constellation.hoverId = null;
    tooltip.classList.remove('visible');
    canvas.style.cursor = 'grab';
  });
  canvas.addEventListener('pointerdown', onConstellationPointerDown);
  window.addEventListener('pointermove', onConstellationPointerDrag);
  window.addEventListener('pointerup', onConstellationPointerUp);
  window.addEventListener('pointercancel', onConstellationPointerUp);

  tickConstellation();
}

function pointerPos(e) {
  const c = __constellation;
  const rect = c.canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function hitTestNode(x, y) {
  const c = __constellation;
  let hit = null, bestD = 18;
  for (const n of c.nodes) {
    const dx = n.x - x, dy = n.y - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < Math.max(bestD, n.r + 8)) { bestD = d; hit = n; }
  }
  return hit;
}

// Returns centroid index, or -1. Nodes take priority over centroid hit.
function hitTestCentroid(x, y) {
  const c = __constellation;
  for (let i = 0; i < c.centroids.length; i++) {
    const cc = c.centroids[i];
    const dx = cc.x - x, dy = cc.y - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    // Ring-shaped hot zone: between r-14 and r+14 for the ring, or within the label band
    if (d > cc.r - 14 && d < cc.r + 14) return i;
  }
  return -1;
}

function onConstellationPointerMove(e) {
  const c = __constellation;
  if (!c || c.drag) return;
  const { x, y } = pointerPos(e);
  const hitNode = hitTestNode(x, y);
  const hitC = hitNode ? -1 : hitTestCentroid(x, y);

  c.hoverId = hitNode ? hitNode.id : null;
  c.hoverCentroid = hitC;
  c.canvas.style.cursor = (hitNode || hitC >= 0) ? 'grab' : 'grab';

  if (hitNode) {
    c.tooltip.innerHTML =
      `<span class="tt-label" style="color:var(--${hitNode.color})">${hitNode.project}</span>${hitNode.filename}`;
    c.tooltip.style.left = `${hitNode.x}px`;
    c.tooltip.style.top  = `${hitNode.y}px`;
    c.tooltip.classList.add('visible');
  } else if (hitC >= 0) {
    const cc = c.centroids[hitC];
    c.tooltip.innerHTML =
      `<span class="tt-label" style="color:var(--${cc.color})">Cluster</span>${cc.label} — drag to reposition`;
    c.tooltip.style.left = `${cc.x}px`;
    c.tooltip.style.top  = `${cc.y - cc.r}px`;
    c.tooltip.classList.add('visible');
  } else {
    c.tooltip.classList.remove('visible');
  }
}

function resizeConstellationCanvas() {
  const c = __constellation;
  if (!c) return;
  const stage = document.getElementById('constellation-stage');
  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const prevW = c.w, prevH = c.h;
  c.w = rect.width; c.h = rect.height; c.dpr = dpr;
  c.canvas.width  = Math.floor(rect.width * dpr);
  c.canvas.height = Math.floor(rect.height * dpr);
  c.canvas.style.width  = rect.width + 'px';
  c.canvas.style.height = rect.height + 'px';
  c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Rescale existing centroids proportionally
  if (c.centroids.length && prevW && prevH) {
    const sx = c.w / prevW, sy = c.h / prevH;
    c.centroids.forEach(p => { p.x *= sx; p.y *= sy; });
  }
}

function initCentroids() {
  const c = __constellation;
  if (!c || c.centroids.length) return;
  const names = Object.keys(PROJECTS);
  // Anchor points along a shallow arc
  const positions = [
    { fx: 0.30, fy: 0.48 },
    { fx: 0.55, fy: 0.60 },
    { fx: 0.78, fy: 0.44 }
  ];
  for (let i = 0; i < names.length; i++) {
    const p = positions[i] || { fx: 0.5, fy: 0.5 };
    c.centroids.push({
      project: names[i],
      color:   PROJECTS[names[i]].color,
      label:   PROJECTS[names[i]].label,
      x: c.w * p.fx,
      y: c.h * p.fy,
      r: 52   // handle hit radius
    });
  }
}

function onConstellationPointerDown(e) {
  const c = __constellation;
  if (!c) return;
  const { x, y } = pointerPos(e);
  const hitNode = hitTestNode(x, y);
  const hitCIdx = hitNode ? -1 : hitTestCentroid(x, y);
  if (!hitNode && hitCIdx < 0) return;

  c.canvas.setPointerCapture(e.pointerId);
  c.canvas.style.cursor = 'grabbing';

  if (hitNode) {
    c.drag = {
      kind: 'node', node: hitNode,
      startX: x, startY: y,
      offsetX: hitNode.x - x, offsetY: hitNode.y - y,
      moved: false, pointerId: e.pointerId
    };
    hitNode.pinned = true;
    hitNode.vx = hitNode.vy = 0;
  } else {
    const cc = c.centroids[hitCIdx];
    c.drag = {
      kind: 'centroid', centroid: cc,
      startX: x, startY: y,
      offsetX: cc.x - x, offsetY: cc.y - y,
      moved: false, pointerId: e.pointerId
    };
  }

  c.tooltip.classList.remove('visible');
  e.preventDefault();
}

function onConstellationPointerDrag(e) {
  const c = __constellation;
  if (!c || !c.drag || e.pointerId !== c.drag.pointerId) return;
  const { x, y } = pointerPos(e);
  const d = c.drag;
  const moved = Math.hypot(x - d.startX, y - d.startY);
  if (moved > 4) d.moved = true;

  if (d.kind === 'node') {
    d.node.x = x + d.offsetX;
    d.node.y = y + d.offsetY;
    d.node.vx = d.node.vy = 0;
  } else if (d.kind === 'centroid') {
    d.centroid.x = x + d.offsetX;
    d.centroid.y = y + d.offsetY;
  }
}

function onConstellationPointerUp(e) {
  const c = __constellation;
  if (!c || !c.drag || e.pointerId !== c.drag.pointerId) return;
  const d = c.drag;

  if (d.kind === 'node') {
    d.node.pinned = false;
    if (!d.moved) {
      // Treat as click — open note
      c.canvas.style.cursor = 'grab';
      try { c.canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      c.drag = null;
      openNoteFromDashboard(d.node.project, d.node.filename);
      return;
    }
  }

  c.canvas.style.cursor = 'grab';
  try { c.canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  c.drag = null;
}

function tickConstellation() {
  const c = __constellation;
  if (!c) return;

  const ctx = c.ctx;
  const w = c.w, h = c.h;
  const nodes = c.nodes;
  c.t += 1;

  // Keep centroids inside the viewport softly (no orbit — user drags them)
  for (const cc of c.centroids) {
    const pad = 60;
    if (cc.x < pad)       cc.x += (pad - cc.x) * 0.08;
    if (cc.x > w - pad)   cc.x -= (cc.x - (w - pad)) * 0.08;
    if (cc.y < pad)       cc.y += (pad - cc.y) * 0.08;
    if (cc.y > h - pad)   cc.y -= (cc.y - (h - pad)) * 0.08;
  }
  const centroids = c.centroids;

  // Forces
  const GRAV = 0.0028;          // pull to project centroid
  const REPEL = 1600;           // node-node repulsion
  const DAMPING = 0.86;
  const MIN_D2 = 64;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.pinned) continue;
    const c0 = centroids[a.projectIdx];
    a.vx += (c0.x - a.x) * GRAV;
    a.vy += (c0.y - a.y) * GRAV;

    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = Math.max(MIN_D2, dx*dx + dy*dy);
      const f = REPEL / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      if (!a.pinned) { a.vx += fx; a.vy += fy; }
      if (!b.pinned) { b.vx -= fx; b.vy -= fy; }
    }
  }

  // Integrate
  for (const n of nodes) {
    if (n.pinned) {
      // Anchor nodes ride the project's centroid so the project's most
      // central note literally sits at the center of its node cloud.
      const c0 = centroids[n.projectIdx];
      if (c0) { n.x = c0.x; n.y = c0.y; }
      n.vx = n.vy = 0;
      continue;
    }
    n.vx *= DAMPING; n.vy *= DAMPING;
    n.x += n.vx; n.y += n.vy;
    // Soft bounds
    const pad = 40;
    if (n.x < pad)       n.vx += (pad - n.x) * 0.04;
    if (n.x > w - pad)   n.vx -= (n.x - (w - pad)) * 0.04;
    if (n.y < pad)       n.vy += (pad - n.y) * 0.04;
    if (n.y > h - pad)   n.vy -= (n.y - (h - pad)) * 0.04;
  }

  // Draw
  ctx.clearRect(0, 0, w, h);

  // Edges: connect each node to its project centroid with a faint line
  ctx.lineWidth = 1;
  for (const n of nodes) {
    const c0 = centroids[n.projectIdx];
    const dimmed = c.highlightKey && n.date !== c.highlightKey;
    ctx.strokeStyle = getColorForNode(n, dimmed ? 0.04 : 0.12);
    ctx.beginPath();
    ctx.moveTo(c0.x, c0.y);
    ctx.lineTo(n.x, n.y);
    ctx.stroke();
  }

  // Same-date links — kept within a project only, never across projects.
  const byDate = {};
  for (const n of nodes) {
    if (!n.date) continue;
    (byDate[n.date] = byDate[n.date] || []).push(n);
  }
  ctx.lineWidth = 0.8;
  for (const key in byDate) {
    const group = byDate[key];
    if (group.length < 2) continue;
    const dimmed = c.highlightKey && key !== c.highlightKey;
    ctx.strokeStyle = dimmed ? 'rgba(232,232,234,0.02)' : 'rgba(232,232,234,0.10)';
    for (let i = 0; i < group.length - 1; i++) {
      for (let j = i + 1; j < group.length; j++) {
        if (group[i].project !== group[j].project) continue;
        ctx.beginPath();
        ctx.moveTo(group[i].x, group[i].y);
        ctx.lineTo(group[j].x, group[j].y);
        ctx.stroke();
      }
    }
  }

  // Centroid wells + draggable handles
  const draggingCentroid = c.drag && c.drag.kind === 'centroid' ? c.drag.centroid : null;
  for (let i = 0; i < centroids.length; i++) {
    const cc = centroids[i];
    const isHover  = c.hoverCentroid === i;
    const isDragging = draggingCentroid === cc;
    const col = cc.color;

    // Soft gravity well
    const grad = ctx.createRadialGradient(cc.x, cc.y, 0, cc.x, cc.y, 100);
    grad.addColorStop(0, getVarColor(col, isDragging ? 0.18 : isHover ? 0.12 : 0.08));
    grad.addColorStop(1, getVarColor(col, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cc.x, cc.y, 100, 0, Math.PI * 2);
    ctx.fill();

    // Dashed handle ring
    ctx.save();
    ctx.setLineDash(isDragging ? [] : [4, 4]);
    ctx.lineWidth = isDragging ? 1.5 : 1;
    ctx.strokeStyle = getVarColor(col, isHover || isDragging ? 0.55 : 0.22);
    ctx.beginPath();
    ctx.arc(cc.x, cc.y, cc.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Label
    ctx.fillStyle = getVarColor(col, isHover || isDragging ? 0.95 : 0.6);
    ctx.font = `500 10px "Geist Mono", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const labelY = cc.y + cc.r + 14;
    ctx.fillText(cc.label.toUpperCase(), cc.x, labelY);
  }

  // Nodes
  for (const n of nodes) {
    const isHover = c.hoverId === n.id;
    const isDragging = c.drag && c.drag.node === n;
    const isHighlighted = c.highlightKey && n.date === c.highlightKey;
    const dimmed = c.highlightKey && !isHighlighted;

    const breathe = isDragging ? 1.15 : 1 + Math.sin(c.t * 0.04 + n.x * 0.02) * 0.08;
    const r = (isHover || isDragging ? n.r + 3 : n.r) * breathe;

    // Halo ring for highlighted / hover / anchor / dragging
    if (isDragging) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 16, 0, Math.PI * 2);
      ctx.fillStyle = getColorForNode(n, 0.12);
      ctx.fill();
    }
    if (isHover || isHighlighted || isDragging) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 8, 0, Math.PI * 2);
      ctx.fillStyle = getColorForNode(n, isDragging ? 0.18 : 0.10);
      ctx.fill();
    }
    if (n.isAnchor) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = getColorForNode(n, dimmed ? 0.10 : 0.35);
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Core
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = getColorForNode(n, dimmed ? 0.25 : 1);
    ctx.fill();

    // Inner highlight
    ctx.beginPath();
    ctx.arc(n.x - r*0.3, n.y - r*0.3, r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = dimmed ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.22)';
    ctx.fill();
  }

  c.rafId = requestAnimationFrame(tickConstellation);
}

function getColorForNode(n, alpha) { return getVarColor(n.color, alpha); }

// Resolve --<name> CSS var to rgba
const __colorCache = {};
function getVarColor(name, alpha) {
  if (!__colorCache[name]) {
    const hex = getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
    __colorCache[name] = hexToRgb(hex);
  }
  const { r, g, b } = __colorCache[name];
  return `rgba(${r},${g},${b},${alpha})`;
}

function stopConstellation() {
  if (!__constellation) return;
  if (__constellation.rafId) cancelAnimationFrame(__constellation.rafId);
  window.removeEventListener('resize', resizeConstellationCanvas);
  window.removeEventListener('pointermove', onConstellationPointerDrag);
  window.removeEventListener('pointerup', onConstellationPointerUp);
  window.removeEventListener('pointercancel', onConstellationPointerUp);
  __constellation = null;
}

function hexToRgb(h) {
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

// ── Render calendar ─────────────────────────────────────────────────────────
function renderCalendar() {
  const dateMap = buildDateMap();
  const MONTH_NAMES = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];
  const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  document.getElementById('cal-month-label').textContent =
    `${MONTH_NAMES[calMonth]} ${calYear}`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // Day-of-week headers
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDow    = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today       = new Date();

  // Leading empty cells
  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.innerHTML = '<span class="cal-day-num"></span><span class="cal-dots"></span>';
    grid.appendChild(el);
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const mm  = String(calMonth + 1).padStart(2, '0');
    const dd  = String(d).padStart(2, '0');
    const key = `${calYear}-${mm}-${dd}`;
    const notes = dateMap[key] || [];

    const isToday    = (today.getFullYear() === calYear &&
                        today.getMonth()    === calMonth &&
                        today.getDate()     === d);
    const isSelected = (selectedCalDate === key);

    const el = document.createElement('div');
    el.className = 'cal-day' +
      (notes.length  ? ' clickable'  : '') +
      (isToday       ? ' today'      : '') +
      (isSelected    ? ' selected'   : '');

    // Unique project colors present on this date
    const colors = [...new Set(notes.map(n => n.color))];
    const dotsHTML = colors.map(c =>
      `<span class="cal-dot" style="background:var(--${c})"></span>`
    ).join('');

    el.innerHTML =
      `<span class="cal-day-num">${d}</span>` +
      `<span class="cal-dots">${dotsHTML}</span>`;

    if (notes.length) {
      el.onclick = () => selectCalDate(key, d, notes);
    }

    grid.appendChild(el);
  }

  // Legend
  const legend = document.getElementById('cal-legend');
  legend.innerHTML = Object.entries(PROJECTS).map(([, cfg]) =>
    `<span class="cal-legend-item">
      <span class="cal-dot" style="background:var(--${cfg.color})"></span>
      <span>${cfg.label}</span>
    </span>`
  ).join('');
}

function shiftMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

// ── Select a calendar date → open drawer + highlight nodes ─────────────────
function selectCalDate(key, day, notes) {
  selectedCalDate = key;
  renderCalendar();

  if (__constellation) __constellation.highlightKey = key;

  const [year, mm] = key.split('-');
  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                        'Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthName = SHORT_MONTHS[parseInt(mm) - 1];

  const drawer = document.getElementById('notes-drawer');
  document.getElementById('drawer-eyebrow').textContent = `${year}`;
  document.getElementById('drawer-title').textContent =
    `${monthName} ${day}`;
  document.getElementById('drawer-sub').textContent =
    `${notes.length} note${notes.length !== 1 ? 's' : ''} captured on this date`;

  document.getElementById('drawer-body').innerHTML =
    notes.map(n => noteEntryHTML(n)).join('');

  drawer.classList.add('open');
  document.querySelector('.dashboard-layout')?.classList.add('drawer-open');
}

function closeDateDrawer() {
  const drawer = document.getElementById('notes-drawer');
  if (drawer) drawer.classList.remove('open');
  document.querySelector('.dashboard-layout')?.classList.remove('drawer-open');
  selectedCalDate = null;
  if (__constellation) __constellation.highlightKey = null;
  renderCalendar();
}

function noteEntryHTML(n) {
  const esc = n.filename.replace(/'/g, "\\'");
  return `
    <div class="note-entry"
         onclick="openNoteFromDashboard('${n.project}','${esc}')">
      <span class="note-proj-badge"
            style="background:var(--${n.color}-glow);color:var(--${n.color});border:1px solid var(--${n.color}-dim)">
        ${n.project}
      </span>
      <span class="note-filename">${n.filename}</span>
      <span class="note-open-hint">open →</span>
    </div>`;
}

// ── Open note from dashboard ───────────────────────────────────────────────
function openNoteFromDashboard(project, filename) {
  stopConstellation();
  // Exit dashboard mode
  document.querySelector('.layout').classList.remove('dashboard-mode');
  document.querySelector('main').classList.remove('dashboard-active');

  // Activate the project tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.querySelector(`.tab[data-project="${project}"]`);
  if (tabEl) tabEl.classList.add('active');

  activeProject = project;
  activeFile    = null;

  renderSidebar(project);

  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>`;

  // Small delay to let DOM update before finding the file item
  setTimeout(() => {
    const items = document.querySelectorAll('.file-item');
    let match = null;
    items.forEach(i => { if (i.dataset.file === filename) match = i; });
    loadFile(project, filename, match);
  }, 40);
}

// ── Render sidebar ─────────────────────────────────────────────────────────
function renderSidebar(project) {
  const cfg  = PROJECTS[project];
  const tree = document.getElementById('file-tree');
  document.getElementById('sidebar-label').textContent = cfg.label.toUpperCase();

  const folder = document.createElement('div');
  folder.className = 'folder open';

  const dotClass = `dot-${cfg.color}`;
  folder.innerHTML = `
    <div class="folder-label" onclick="this.parentElement.classList.toggle('open')">
      <span class="chevron">▶</span>
      <span class="folder-dot ${dotClass}"></span>
      <span class="folder-name">${project}</span>
    </div>
    <div class="file-list" id="file-list"></div>
  `;
  tree.innerHTML = '';
  tree.appendChild(folder);

  const list = folder.querySelector('#file-list');
  cfg.files.forEach((filename, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.file = filename;
    item.style.setProperty('--i', i);
    const icon = filename.endsWith('.html') ? '⬡' : '◈';
    item.innerHTML = `<span class="file-icon">${icon}</span>${filename}`;
    item.onclick = () => { loadFile(project, filename, item); closeSidebar(); };
    list.appendChild(item);
  });
}

// ── Project switch ─────────────────────────────────────────────────────────
function selectProject(project, tabEl) {
  // Sync active state across both the header tabs and the mobile-menu tabs.
  document.querySelectorAll('.tab, .mobile-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll(
    `.tab[data-project="${project}"], .mobile-tab[data-project="${project}"]`,
  ).forEach(t => t.classList.add('active'));
  // Close the mobile sheet after a tap.
  closeSidebar();

  if (project === 'Dashboard') {
    document.getElementById('sidebar-toggle').style.display = 'none';
    stopConstellation();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    showDashboard();
    return;
  }

  if (project === 'Concepts') {
    document.getElementById('sidebar-toggle').style.display = 'none';
    closeSidebar();
    stopConstellation();
    document.querySelector('.layout').classList.remove('dashboard-mode');
    document.querySelector('main').classList.remove('dashboard-active');
    document.querySelector('.layout').classList.add('concepts-mode');
    document.querySelector('main').classList.add('concepts-active');
    location.hash = encodeURIComponent(project);
    showConcepts();
    return;
  }

  location.hash = encodeURIComponent(project);

  stopConstellation();
  document.getElementById('sidebar-toggle').style.display = '';

  // Exit dashboard / concepts modes
  document.querySelector('.layout').classList.remove('dashboard-mode', 'concepts-mode');
  document.querySelector('main').classList.remove('dashboard-active', 'concepts-active');

  activeProject = project;
  activeFile    = null;

  renderSidebar(project);
  showLanding(project);

  document.getElementById('bc-project').textContent = project;
  document.getElementById('status-text').textContent = `${PROJECTS[project].files.length} files`;
}

// ── Landing screen ─────────────────────────────────────────────────────────
function showLanding(project) {
  const cfg  = PROJECTS[project];
  const area = document.getElementById('content-area');

  const filesHTML = cfg.files.map((f, i) => {
    const isHtml = f.endsWith('.html');
    return `
      <div class="landing-file ${cfg.color}" style="--i:${i}"
           onclick="loadFileByName('${project}','${f.replace(/'/g,"\\'")}')">
        <span class="landing-file-icon">${isHtml ? 'html' : 'md'}</span>
        <span class="landing-file-name">${f}</span>
        <span class="landing-file-arrow">→</span>
      </div>`;
  }).join('');

  area.innerHTML = `
    <div class="project-landing">
      <div class="project-hero ${cfg.color}">
        <div class="card-label ${cfg.color}">${cfg.label}</div>
        <div class="card-title">${cfg.label}</div>
        <div class="card-desc">${cfg.desc}</div>
        <div class="card-count">${String(cfg.files.length).padStart(2,'0')} / ${cfg.files.length === 1 ? 'note' : 'notes'}</div>
      </div>
      <div class="landing-files">
        <div class="landing-files-head">Files · ${cfg.files.length}</div>
        ${filesHTML}
      </div>
    </div>
  `;

  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>`;
}

// ── Load a file ────────────────────────────────────────────────────────────
// ── Wikilink helpers ───────────────────────────────────────────────────────
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => escHtml(s).replace(/"/g,'&quot;');

// Normalize for fuzzy filename matching: lowercase, strip .md, unify separators,
// drop punctuation that Obsidian ignores in link resolution.
function normKey(s) {
  return String(s)
    .toLowerCase()
    .replace(/\.md$/, '')
    .replace(/[_\s\-]+/g, ' ')
    .trim();
}

// Build a {normalized-name → [{project, filename}]} index over all projects.
let _wikiIndex = null;
function wikiIndex() {
  if (_wikiIndex) return _wikiIndex;
  const idx = {};
  for (const [project, cfg] of Object.entries(PROJECTS)) {
    if (!cfg.files) continue;
    for (const filename of cfg.files) {
      const key = normKey(filename);
      (idx[key] = idx[key] || []).push({ project, filename });
    }
  }
  _wikiIndex = idx;
  return idx;
}

// Resolve [[target]] → {project, filename} or null. Prefers current project.
function resolveWikilink(target, fromProject) {
  let t = String(target).split('#')[0].split('^')[0];
  const slash = t.lastIndexOf('/');
  if (slash !== -1) t = t.slice(slash + 1);
  const hits = wikiIndex()[normKey(t)];
  if (!hits || !hits.length) return null;
  return hits.find(h => h.project === fromProject) || hits[0];
}

function hydrateWikilinks(container, fromProject) {
  container.querySelectorAll('a.wikilink[data-target]').forEach(a => {
    const target = a.getAttribute('data-target');
    const hit = resolveWikilink(target, fromProject);
    if (!hit) {
      a.classList.add('broken');
      a.title = `No note found for "${target}"`;
      a.addEventListener('click', e => e.preventDefault());
      return;
    }
    a.href = '#' + encodeURIComponent(hit.project) + '/' + encodeURIComponent(hit.filename);
    a.title = `${hit.project} › ${hit.filename}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      if (hit.project !== activeProject) {
        const tab = document.querySelector(`.tab[data-project="${hit.project}"]`);
        if (tab) selectProject(hit.project, tab);
      }
      setTimeout(() => loadFileByName(hit.project, hit.filename), 0);
    });
  });
}

function renderObsidianMarkdown(md) {
  // 1. Extract math so marked's GFM doesn't mangle underscores/asterisks inside formulas.
  const mathBlocks = [];
  const stash = (tex, display) => `@@MATHBLOCK${mathBlocks.push({tex, display}) - 1}@@`;

  let work = md
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => stash(tex.trim(), true))
    .replace(/(?<![\\$])\$(?!\s)([^\$\n]+?)(?<!\s)\$(?!\$)/g, (_, tex) => stash(tex, false));

  // 2. Obsidian-isms.
  work = work
    .replace(/!\[\[([^\]]+)\]\]/g, '_[image: $1]_')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,
      (_, t, d) => `<a class="wikilink" data-target="${escAttr(t)}">${escHtml(d)}</a>`)
    .replace(/\[\[([^\]]+)\]\]/g,
      (_, t) => `<a class="wikilink" data-target="${escAttr(t)}">${escHtml(t)}</a>`)
    .replace(/==([^=\n]+)==/g, '<mark>$1</mark>');

  // 3. Markdown → HTML.
  let html = marked.parse(work);

  // 4. Restore math, rendered with KaTeX.
  html = html.replace(/@@MATHBLOCK(\d+)@@/g, (_, i) => {
    const { tex, display } = mathBlocks[+i];
    if (!window.katex) return display ? `<pre>$$${tex}$$</pre>` : `<code>$${tex}$</code>`;
    try {
      return katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) {
      return `<code>${display ? '$$' + tex + '$$' : '$' + tex + '$'}</code>`;
    }
  });

  return html;
}

async function loadFile(project, filename, itemEl) {
  document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');
  activeFile = filename;
  location.hash = encodeURIComponent(project) + '/' + encodeURIComponent(filename);

  document.getElementById('breadcrumb').innerHTML =
    `<span id="bc-project">${project}</span>
     <span style="color:var(--text-muted)">›</span>
     <span>${filename}</span>`;

  document.getElementById('status-text').textContent = `Loading ${filename}…`;

  const area = document.getElementById('content-area');
  area.innerHTML = `
    <div class="loading">
      <div class="skel h1"></div>
      <div class="skel p"></div>
      <div class="skel p mid"></div>
      <div class="skel p"></div>
      <div class="skel p short"></div>
    </div>`;

  const path = `/notes/${encodeURIComponent(project)}/${encodeURIComponent(filename)}`;

  const scroll = document.getElementById('content-scroll');

  // HTML files — render in a full-height iframe
  if (filename.endsWith('.html')) {
    scroll.classList.add('iframe-mode');
    area.innerHTML = `<iframe src="${path}" style="width:100%;height:100%;border:none;display:block;"></iframe>`;
    document.getElementById('status-text').textContent = filename;
    return;
  }

  scroll.classList.remove('iframe-mode');

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();

    area.innerHTML = `<div class="md-body">${renderObsidianMarkdown(md)}</div>`;
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.disabled = true);
    hydrateWikilinks(area, project);

    document.getElementById('content-scroll').scrollTop = 0;
    document.getElementById('status-text').textContent = filename;
  } catch (err) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-glyph">⚠</div>
        <p>Could not load file</p>
        <p style="color:var(--text-muted);font-size:10px;margin-top:4px">${err.message}</p>
        <p style="color:var(--text-muted);font-size:10px">Path: ${path}</p>
      </div>`;
    document.getElementById('status-text').textContent = 'Error loading file';
  }
}

function loadFileByName(project, filename) {
  const items = document.querySelectorAll('.file-item');
  let match = null;
  items.forEach(i => { if (i.dataset.file === filename) match = i; });
  loadFile(project, filename, match);
}

// ── Mobile sidebar toggle ─────────────────────────────────────────────────
function toggleSidebar() {
  const aside   = document.querySelector('aside');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen  = aside.classList.toggle('open');
  overlay.classList.toggle('visible', isOpen);
}

function closeSidebar() {
  document.querySelector('aside').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}

// ── Theme toggle ───────────────────────────────────────────────────────────
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem('notes-theme', mode); } catch (_) {}
  // Invalidate canvas color cache so the constellation picks up new palette
  for (const k in __colorCache) delete __colorCache[k];
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('notes-theme'); } catch (_) {}
  if (saved === 'light' || saved === 'dark') {
    applyTheme(saved);
  } else {
    applyTheme('dark');
  }
})();

// ── Init ───────────────────────────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });

// Hash routing — open a specific file if URL contains #Project/filename
// ── Concepts view ──────────────────────────────────────────────────────────
let __conceptsData = null;     // { concepts, byChunk, generatedAt }
let __conceptsChunks = null;   // array of chunk records, indexed by id
let __conceptsState = { kind: 'all', query: '', open: new Set(), view: 'graph' };
let __d3LoadPromise = null;
let __conceptsGraph = null; // { simulation, svg } so we can stop on view-switch

async function loadConceptsData() {
  if (__conceptsData && __conceptsChunks) return;
  const [cRes, kRes] = await Promise.all([
    fetch('/public/concepts.json', { cache: 'no-cache' }),
    fetch('/public/chunks.json',  { cache: 'no-cache' }),
  ]);
  if (!cRes.ok) throw new Error(`concepts.json: ${cRes.status}`);
  if (!kRes.ok) throw new Error(`chunks.json: ${kRes.status}`);
  __conceptsData = await cRes.json();
  const arr = await kRes.json();
  __conceptsChunks = new Map();
  for (const c of arr) __conceptsChunks.set(c.id, c);
}

function projectDotColor(project) {
  return ({
    COSZO:        'var(--coszo)',
    BransfieldEQ: 'var(--bransfield)',
    Earthnote:    'var(--earthnote)',
  })[project] || 'var(--muted)';
}

function renderConceptsList() {
  const area = document.getElementById('content-area');
  const data = __conceptsData;
  if (!data || !data.concepts) return;

  const q = __conceptsState.query.trim().toLowerCase();
  const kind = __conceptsState.kind;
  const filtered = data.concepts.filter((c) => {
    if (kind !== 'all' && c.kind !== kind) return false;
    if (q && !c.label.includes(q)) return false;
    return true;
  });

  const host = document.getElementById('concepts-render');
  if (!host) return;
  host.innerHTML = `<div class="concept-list" id="concept-list"></div>`;
  const listEl = document.getElementById('concept-list');
  if (!filtered.length) {
    listEl.innerHTML = `<div class="concepts-empty">No concepts match.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map((c) => {
    const open = __conceptsState.open.has(c.id);
    const dots = c.projects.map((p) =>
      `<span class="concept-proj-dot" style="background:${projectDotColor(p)}" title="${p}"></span>`
    ).join('');
    const body = open ? renderConceptBody(c) : '';
    const safeId = c.id.replace(/"/g, '&quot;');
    return `
      <div class="concept-row ${open ? 'open' : ''}" data-id="${safeId}">
        <div class="concept-header" onclick="toggleConcept('${safeId}')">
          <span class="concept-kind">${c.kind}</span>
          <span class="concept-label">${escHtml(c.label)}</span>
          <span class="concept-projects">${dots}</span>
          <span class="concept-count">${c.count}</span>
          <span class="concept-chevron">▸</span>
        </div>
        <div class="concept-body">${body}</div>
      </div>`;
  }).join('');
}

function renderConceptBody(concept) {
  const chunkHTMLs = concept.chunkIds.map((cid) => {
    const ch = __conceptsChunks.get(cid);
    if (!ch) return '';
    const snippet = (ch.text || '').slice(0, 320) + (ch.text && ch.text.length > 320 ? '…' : '');
    const sectionPath = Array.isArray(ch.sectionPath) && ch.sectionPath.length
      ? ch.sectionPath.join(' / ') : (ch.sectionTitle || '');
    const fname = ch.filePath ? ch.filePath.split('/').slice(-1)[0] : '';
    const proj = ch.project || '';
    const projColor = projectDotColor(proj);
    const args = `'${proj}','${(fname || '').replace(/'/g, "\\'")}'`;
    return `
      <div class="concept-chunk">
        <div class="concept-chunk-head">
          <span class="concept-proj-dot" style="background:${projColor}"></span>
          <a class="concept-chunk-link" onclick="openNoteFromConcepts(${args})">${escHtml(ch.noteTitle || fname)}</a>
          ${sectionPath ? `<span>· ${escHtml(sectionPath)}</span>` : ''}
        </div>
        <div class="concept-chunk-snippet">${escHtml(snippet)}</div>
      </div>`;
  }).join('');
  return chunkHTMLs || `<div class="concepts-empty">No chunks loaded.</div>`;
}

function toggleGraphHud() {
  const hud = document.getElementById('cg-hud');
  if (!hud) return;
  const collapsed = hud.classList.toggle('is-collapsed');
  const btn = document.getElementById('cg-hud-toggle');
  if (btn) btn.textContent = collapsed ? '▸' : '×';
}

function toggleConcept(id) {
  if (__conceptsState.open.has(id)) __conceptsState.open.delete(id);
  else __conceptsState.open.add(id);
  renderConceptsList();
}

function openNoteFromConcepts(project, filename) {
  const tabEl = document.querySelector(`.tab[data-project="${project}"]`);
  if (!tabEl) return;
  selectProject(project, tabEl);
  setTimeout(() => loadFileByName(project, filename), 0);
}

function setConceptKind(k) {
  __conceptsState.kind = k;
  document.querySelectorAll('.concept-filter').forEach((el) => {
    el.classList.toggle('active', el.dataset.kind === k);
  });
  renderConcepts();
  updateGraphSummaryMode();
}

async function showConcepts() {
  const area = document.getElementById('content-area');
  document.getElementById('bc-project').textContent = 'Concepts';
  document.getElementById('status-text').textContent = 'Loading concepts…';

  area.innerHTML = `
    <div class="concepts-view">
      <div class="concepts-head">
        <div class="concepts-title">Concepts</div>
        <div class="concepts-meta" id="concepts-meta">loading…</div>
      </div>
      <div class="concepts-controls">
        <div class="concepts-view-toggle">
          <button class="concepts-view-btn ${__conceptsState.view === 'list' ? 'active' : ''}" data-view="list"  onclick="setConceptView('list')">List</button>
          <button class="concepts-view-btn ${__conceptsState.view === 'graph' ? 'active' : ''}" data-view="graph" onclick="setConceptView('graph')">Graph</button>
        </div>
        <div class="concepts-search-wrap" id="concepts-search-wrap">
          <input class="concepts-search" id="concepts-search" placeholder="filter by name…" autocomplete="off"/>
          <button class="concepts-search-clear" id="concepts-search-clear" onclick="clearConceptSearch()" aria-label="Clear search">×</button>
        </div>
        <button class="concept-filter active" data-kind="all"        onclick="setConceptKind('all')">All</button>
        <button class="concept-filter"        data-kind="method"     onclick="setConceptKind('method')">Methods</button>
        <button class="concept-filter"        data-kind="instrument" onclick="setConceptKind('instrument')">Instruments</button>
        <button class="concept-filter"        data-kind="dataset"    onclick="setConceptKind('dataset')">Datasets</button>
        <button class="concept-filter"        data-kind="quantity"   onclick="setConceptKind('quantity')">Quantities</button>
      </div>
      <div id="concepts-render"></div>
    </div>`;

  try {
    await loadConceptsData();
  } catch (err) {
    document.getElementById('concepts-render').innerHTML =
      `<div class="concepts-empty">Couldn't load concepts: ${escHtml(err.message)}.<br>` +
      `Run the indexer to generate <code>public/concepts.json</code>.</div>`;
    document.getElementById('concepts-meta').textContent = 'unavailable';
    document.getElementById('status-text').textContent = 'Concepts unavailable';
    return;
  }

  const total = __conceptsData.concepts.length;
  const when  = __conceptsData.generatedAt
    ? new Date(__conceptsData.generatedAt).toISOString().slice(0, 10) : '';
  document.getElementById('concepts-meta').textContent =
    `${total} concepts · ${__conceptsChunks.size} chunks${when ? ' · ' + when : ''}`;
  document.getElementById('status-text').textContent = `${total} concepts`;

  const search = document.getElementById('concepts-search');
  const searchWrap = document.getElementById('concepts-search-wrap');
  search.addEventListener('input', (e) => {
    __conceptsState.query = e.target.value;
    if (searchWrap) searchWrap.classList.toggle('has-text', !!e.target.value);
    renderConcepts();
  });
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') clearConceptSearch();
  });

  renderConcepts();
}

function clearConceptSearch() {
  __conceptsState.query = '';
  const input = document.getElementById('concepts-search');
  if (input) input.value = '';
  document.getElementById('concepts-search-wrap')?.classList.remove('has-text');
  renderConcepts();
}

// Toggle summary mode on the graph when neither a kind filter nor a search
// is active. Called whenever state changes that affect what should be visible.
function updateGraphSummaryMode() {
  if (__conceptsState.view !== 'graph') return;
  const wrap = document.getElementById('cg-wrap');
  if (!wrap) return;
  const isSummary = !__conceptsState.query.trim();
  wrap.classList.toggle('cg-summary', isSummary);
}

// ── Concepts: list/graph dispatcher ────────────────────────────────────────
function renderConcepts() {
  if (__conceptsGraph) {
    try { __conceptsGraph.simulation && __conceptsGraph.simulation.stop(); } catch {}
    __conceptsGraph = null;
  }
  if (__conceptsState.view === 'graph') renderConceptsGraph();
  else renderConceptsList();
}

function setConceptView(v) {
  if (__conceptsState.view === v) return;
  __conceptsState.view = v;
  document.querySelectorAll('.concepts-view-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.view === v);
  });
  renderConcepts();
}

// ── Concepts: graph view ───────────────────────────────────────────────────
function ensureD3() {
  if (window.d3 && window.d3.forceSimulation) return Promise.resolve();
  if (__d3LoadPromise) return __d3LoadPromise;
  __d3LoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js';
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load d3'));
    document.head.appendChild(s);
  });
  return __d3LoadPromise;
}

function conceptKindColor(kind) {
  // Theme-aware: returns CSS var() so dark/light switching is automatic.
  return ({
    method:     'var(--kind-method)',
    instrument: 'var(--kind-instrument)',
    dataset:    'var(--kind-dataset)',
    quantity:   'var(--kind-quantity)',
  })[kind] || 'var(--text-3)';
}

function buildGraphData() {
  const q = __conceptsState.query.trim().toLowerCase();
  const kindFilter = __conceptsState.kind;

  const concepts = __conceptsData.concepts.filter((c) => {
    if (kindFilter !== 'all' && c.kind !== kindFilter) return false;
    if (q && !c.label.includes(q)) return false;
    return true;
  });

  const noteIds = new Set();
  for (const c of concepts) for (const n of c.noteIds) noteIds.add(n);

  const noteMeta = new Map();
  for (const ch of __conceptsChunks.values()) {
    if (!noteIds.has(ch.noteId)) continue;
    if (noteMeta.has(ch.noteId)) continue;
    noteMeta.set(ch.noteId, { title: ch.noteTitle || ch.filePath, project: ch.project, filePath: ch.filePath });
  }

  const nodes = [];
  for (const c of concepts) {
    nodes.push({
      id: 'c::' + c.id,
      type: 'concept',
      label: c.label,
      kind: c.kind,
      count: c.count,
      raw: c,
    });
  }
  for (const [nid, meta] of noteMeta) {
    nodes.push({
      id: 'n::' + nid,
      type: 'note',
      label: meta.title,
      project: meta.project,
      filePath: meta.filePath,
      noteId: nid,
    });
  }

  const links = [];
  for (const c of concepts) {
    for (const nid of c.noteIds) {
      if (!noteMeta.has(nid)) continue;
      links.push({ source: 'c::' + c.id, target: 'n::' + nid });
    }
  }
  return { nodes, links };
}

        <div class="cg-hud-collapsed-label">Legend</div>

        <div class="cg-hud-section">

          <div class="cg-hud-row"><span class="cg-hud-dot" style="--swatch: var(--kind-method)"></span>method</div>
          <div class="cg-hud-row"><span class="cg-hud-dot" style="--swatch: var(--kind-instrument)"></span>instrument</div>
          <div class="cg-hud-row"><span class="cg-hud-dot" style="--swatch: var(--kind-dataset)"></span>dataset</div>

          <div class="cg-hud-row"><span class="cg-hud-dot" style="--swatch: var(--bransfield)"></span>Bransfield</div>
          <div class="cg-hud-row"><span class="cg-hud-dot" style="--swatch: var(--earthnote)"></span>Earthnote</div>
        </div>

        <button class="cg-ctrl-btn" id="cg-fit-btn" onclick="cgFitToView()" title="Zoom out to fit" aria-label="Zoom out to fit">⤢</button>
        <button class="cg-ctrl-btn" id="cg-fullscreen-btn" onclick="cgToggleFullscreen()" title="Fullscreen" aria-label="Fullscreen">⛶</button>

  ensureD3()

    });
}

function mountGraph(data) {
  const d3 = window.d3;
  const wrap = document.getElementById('cg-wrap');
  const svgEl = document.getElementById('cg-svg');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;

  const stats = document.getElementById('cg-hud-stats');
  const conceptCount = data.nodes.filter((n) => n.type === 'concept').length;
  const noteCount    = data.nodes.filter((n) => n.type === 'note').length;
  stats.innerHTML = `
    <span class="cg-hud-stat-num">${String(conceptCount).padStart(2, '0')}</span><span class="cg-hud-stat-label">Concepts</span>
    <span class="cg-hud-stat-num">${String(noteCount).padStart(2, '0')}</span><span class="cg-hud-stat-label">Notes</span>
    <span class="cg-hud-stat-num">${String(data.links.length).padStart(2, '0')}</span><span class="cg-hud-stat-label">Links</span>`;

  const svg = d3.select(svgEl).attr('viewBox', [0, 0, width, height]);
  svg.selectAll('*').remove();

  const root = svg.append('g');

  // Smooth zoom/pan — define early so post-settle fit-to-view can use it.
  const zoom = d3.zoom()
    .scaleExtent([0.15, 4])
    .filter((event) => !event.target.closest('.cg-side') && !event.button)
    .on('zoom', (e) => root.attr('transform', e.transform));
  svg.call(zoom);

  // Adjacency for fast neighbor highlight.
  const adj = new Map();
  data.nodes.forEach((n) => adj.set(n.id, new Set([n.id])));
  data.links.forEach((l) => {
    const sId = typeof l.source === 'object' ? l.source.id : l.source;
    const tId = typeof l.target === 'object' ? l.target.id : l.target;
    adj.get(sId).add(tId);
    adj.get(tId).add(sId);
  });

  const link = root.append('g').attr('class', 'cg-links').selectAll('path')
    .data(data.links).enter()
    .append('path').attr('class', 'cg-link');

  // Pre-compute degree so we can mark "top" hub nodes for summary-mode emphasis.
  const degree = new Map();
  data.nodes.forEach((n) => degree.set(n.id, 0));
  data.links.forEach((l) => {
    const sId = typeof l.source === 'object' ? l.source.id : l.source;
    const tId = typeof l.target === 'object' ? l.target.id : l.target;
    degree.set(sId, (degree.get(sId) || 0) + 1);
    degree.set(tId, (degree.get(tId) || 0) + 1);
  });
  // Concept-note graph is structurally lopsided: notes mention many concepts,
  // concepts often live on few notes. Use type-specific thresholds so summary
  // mode surfaces both kinds of hubs.
  const TOP_DEGREE_CONCEPT = 3;
  const TOP_DEGREE_NOTE    = 5;

  const node = root.append('g').attr('class', 'cg-nodes').selectAll('g')
    .data(data.nodes).enter()
    .append('g')
    .attr('class', (d) => {
      const base = d.type === 'note' ? 'cg-node cg-node-note' : 'cg-node cg-node-concept';
      const tier = d.type === 'concept'
        ? `cg-kind-${d.kind}`
        : `cg-proj-${d.project}`;
      const threshold = d.type === 'concept' ? TOP_DEGREE_CONCEPT : TOP_DEGREE_NOTE;
      const top = (degree.get(d.id) || 0) >= threshold ? 'is-top' : '';
      return [base, tier, top].filter(Boolean).join(' ');
    });

  // Halo (blurred filled circle) under each node.
  node.append('circle').attr('class', 'cg-node-halo')
    .attr('r', (d) => d.type === 'concept'
      ? 8 + Math.sqrt(d.count) * 4
      : 6);

  // Core node.
  node.append('circle').attr('class', 'cg-node-core')
    .attr('r', (d) => d.type === 'concept'
      ? 4 + Math.sqrt(d.count) * 2
      : 3.5);

  // Concept labels always visible; note labels appear on focus/hover.
  node.append('text')
    .attr('class', (d) => 'cg-label ' + (d.type === 'note' ? 'is-note' : 'is-concept'))
    .attr('dx', (d) => (d.type === 'concept' ? 4 + Math.sqrt(d.count) * 2 : 4) + 6)
    .attr('dy', '0.32em')
    .text((d) => {
      const max = d.type === 'concept' ? 28 : 24;
      return d.label.length > max ? d.label.slice(0, max - 1) + '…' : d.label;
    });

  // Selection state lives outside d3 so click-to-select and click-empty-to-clear behave.
  let selectedId = null;

  function applyHighlight(focusId) {
    if (!focusId) {
      node.classed('is-faded', false).classed('is-focused', false).classed('is-selected', false);
      link.classed('is-faded', false).classed('is-focused', false);
      return;
    }
    const ns = adj.get(focusId) || new Set([focusId]);
    node.classed('is-faded',   (n) => !ns.has(n.id));
    node.classed('is-focused', (n) => ns.has(n.id) && n.id !== focusId);
    node.classed('is-selected', (n) => n.id === focusId)
        .classed('is-focused', (n) => ns.has(n.id)); // include the selected itself in halo treatment
    link.classed('is-faded',   (l) => {
      const sId = typeof l.source === 'object' ? l.source.id : l.source;
      const tId = typeof l.target === 'object' ? l.target.id : l.target;
      return !(sId === focusId || tId === focusId);
    });
    link.classed('is-focused', (l) => {
      const sId = typeof l.source === 'object' ? l.source.id : l.source;
      const tId = typeof l.target === 'object' ? l.target.id : l.target;
      return sId === focusId || tId === focusId;
    });
  }

  function selectNode(d) {
    selectedId = d ? d.id : null;
    applyHighlight(selectedId);
    if (!d) {
      closeGraphSide();
    } else if (d.type === 'concept') {
      openConceptSide(d.raw);
    } else {
      openNoteSide(d, data);
    }
  }

  node
    .on('mouseenter', (e, d) => { if (!selectedId) applyHighlight(d.id); })
    .on('mouseleave', ()    => { if (!selectedId) applyHighlight(null);  })
    .on('click', (e, d) => {
      e.stopPropagation();
      if (selectedId === d.id) selectNode(null);
      else selectNode(d);
    })
    .on('dblclick', (e, d) => {
      e.stopPropagation();
      if (d.type === 'note') openNoteFromConcepts(d.project, d.filePath.split('/').slice(-1)[0]);
    });

  svgEl.addEventListener('click', () => { if (selectedId) selectNode(null); });

  // Curved edges (gentle arc) to read better than straight lines.
  function pathFor(d) {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dr = Math.hypot(dx, dy) * 1.4 || 1;
    return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
  }

  // Calmer simulation: settles, then stops. No perpetual jitter.
  const sim = d3.forceSimulation(data.nodes)
    .alpha(0.9)
    .alphaDecay(0.035)
    .velocityDecay(0.45)
    .force('link', d3.forceLink(data.links).id((d) => d.id)
      .distance((l) => l.source.type === 'concept' ? 64 : 72)
      .strength(0.55))
    .force('charge', d3.forceManyBody().strength(-260).distanceMax(420))
    .force('center', d3.forceCenter(width / 2, height / 2).strength(0.08))
    .force('x', d3.forceX(width / 2).strength(0.04))
    .force('y', d3.forceY(height / 2).strength(0.06))
    .force('collide', d3.forceCollide().radius((d) =>
      d.type === 'concept' ? 12 + Math.sqrt(d.count) * 2 : 9).strength(0.9))
    .on('tick', () => {
      link.attr('d', pathFor);
      node.attr('transform', (d) => `translate(${d.x},${d.y})`);
    });

  // Auto-stop background drift after settle. No auto fit-to-view —
  // users use the zoom-out button when they want it.
  setTimeout(() => sim.alphaTarget(0).stop(), 4000);

  // Drag pins; double-click on background releases all pins.
  node.call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.15).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); }));

  svgEl.addEventListener('dblclick', () => {
    data.nodes.forEach((n) => { n.fx = null; n.fy = null; });
    sim.alpha(0.3).restart();
    setTimeout(() => sim.alphaTarget(0).stop(), 3500);
  });

  __conceptsGraph = { simulation: sim, svg, root, wrap, zoom, d3 };

  // Initial summary-mode state. Recomputed on filter/search changes via
  // updateGraphSummaryMode().
  setTimeout(updateGraphSummaryMode, 0);

  // Start HUD collapsed on small viewports — it covers too much of the canvas.
  if (window.matchMedia('(max-width: 768px)').matches) {
    const hud = document.getElementById('cg-hud');
    const btn = document.getElementById('cg-hud-toggle');
    if (hud) hud.classList.add('is-collapsed');
    if (btn) btn.textContent = '▸';
  }
}

// Fit the entire force-laid-out graph into the canvas with a small margin.
// Called once after the simulation cools so users see the whole atlas.
function cgFitToView() {
  if (!__conceptsGraph) return;
  const { svg, root, wrap, zoom, d3 } = __conceptsGraph;
  fitGraphToView(svg, root, wrap, zoom, d3);
}

function cgToggleFullscreen() {
  const wrap = document.getElementById('cg-wrap');
  if (!wrap) return;
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (wrap.requestFullscreen) {
    wrap.requestFullscreen();
  } else if (wrap.webkitRequestFullscreen) {
    wrap.webkitRequestFullscreen();
  }
}

function fitGraphToView(svg, root, wrap, zoom, d3) {
  try {
    const bbox = root.node().getBBox();
    if (!bbox.width || !bbox.height) return;
    const W = wrap.clientWidth;
    const H = wrap.clientHeight;
    const pad = 80;
    const scale = Math.min(
      (W - pad * 2) / bbox.width,
      (H - pad * 2) / bbox.height,
      1.0,
    );
    const tx = W / 2 - (bbox.x + bbox.width  / 2) * scale;
    const ty = H / 2 - (bbox.y + bbox.height / 2) * scale;
    svg.transition().duration(500)
      .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch (_) {
    // getBBox may throw on detached nodes; safe to ignore.
  }
}

function openConceptSide(concept) {
  const side  = document.getElementById('cg-side');
  const title = document.getElementById('cg-side-title');
  const kind  = document.getElementById('cg-side-kind');
  const meta  = document.getElementById('cg-side-meta');
  const list  = document.getElementById('cg-side-list');
  if (!side) return;
  title.textContent = concept.label;
  kind.textContent  = concept.kind;
  kind.style.color  = conceptKindColor(concept.kind);
  meta.textContent  = `${concept.count} chunk${concept.count === 1 ? '' : 's'} · ${concept.projects.join(' · ')}`;
  list.innerHTML = renderConceptBody(concept);
  side.classList.add('open');
  side.scrollTop = 0;
}

function openNoteSide(noteNode, graphData) {
  const side  = document.getElementById('cg-side');
  const title = document.getElementById('cg-side-title');
  const kind  = document.getElementById('cg-side-kind');
  const meta  = document.getElementById('cg-side-meta');
  const list  = document.getElementById('cg-side-list');
  if (!side) return;
  // Concepts present on this note = neighbors of the note node that are concepts.
  const concepts = [];
  for (const l of graphData.links) {
    const sId = typeof l.source === 'object' ? l.source.id : l.source;
    const tId = typeof l.target === 'object' ? l.target.id : l.target;
    if (sId === noteNode.id || tId === noteNode.id) {
      const otherId = sId === noteNode.id ? tId : sId;
      const otherNode = graphData.nodes.find((n) => n.id === otherId);
      if (otherNode && otherNode.type === 'concept') concepts.push(otherNode.raw);
    }
  }
  title.textContent = noteNode.label;
  kind.textContent  = noteNode.project;
  kind.style.color  = projectDotColor(noteNode.project);
  meta.textContent  = `${concepts.length} concept${concepts.length === 1 ? '' : 's'}`;
  const fname = noteNode.filePath ? noteNode.filePath.split('/').slice(-1)[0] : '';
  const args = `'${noteNode.project}','${(fname || '').replace(/'/g, "\\'")}'`;
  const conceptList = concepts.map((c) => `
    <div class="cg-side-conceptrow">
      <span class="cg-side-conceptrow-dot" style="background:${conceptKindColor(c.kind)}"></span>
      <span class="cg-side-conceptrow-label">${escHtml(c.label)}</span>
      <span class="cg-side-conceptrow-kind">${c.kind}</span>
    </div>`).join('');
  list.innerHTML = `
    <button class="cg-side-open-btn" onclick="openNoteFromConcepts(${args})">Open note →</button>
    ${conceptList || '<div class="concepts-empty" style="padding:20px 0;">No concepts on this note.</div>'}`;
  side.classList.add('open');
  side.scrollTop = 0;
}

function closeGraphSide() {
  const side = document.getElementById('cg-side');
  if (side) side.classList.remove('open');
}

(function () {
  const hash = location.hash.slice(1);
  if (!hash) { showDashboard(); return; }
  const slash = hash.indexOf('/');
  const project  = decodeURIComponent(slash === -1 ? hash : hash.slice(0, slash));
  const filename = slash === -1 ? null : decodeURIComponent(hash.slice(slash + 1));
  const tabEl = document.querySelector(`.tab[data-project="${project}"]`);
  if (!tabEl) { showDashboard(); return; }
  selectProject(project, tabEl);
  // Wait one tick for the file list to render, then load the file
  if (filename) setTimeout(() => loadFileByName(project, filename), 0);
})();
</script>
